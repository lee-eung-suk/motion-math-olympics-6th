<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<body>

<div class="game-stage">
  <video id="video" playsinline muted style="display:none"></video>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="rec" id="recIndicator" style="display:none"><span class="dot"></span>REC</div>

  <div class="overlay-panel" id="loadingPanel">

    <p id="loadingText">준비 중…</p>
  </div>

  <div class="overlay-panel" id="rulePanel" style="display:none">
    <div class="rule-card">
      <div class="rule-head">
        <div class="rule-char">🐧</div>
        <div>
          <div class="rule-name">카고</div>
          <h2 class="rule-title">우주 화물 수송대</h2>
        </div>
      </div>
      <p class="rule-cheer"></p>
      <ul class="rule-list"></ul>
      <div class="rule-timer"><div class="rule-timer-fill"></div></div>

  <div class="overlay-panel" id="raisePanel" style="display:none">

      <div class="stat-box"><div class="num" id="statCount">0개</div><div class="label">실은 화물</div></div>
      <div class="stat-box"><div class="num" id="statBest">0개</div><div class="label">최고 기록</div></div>

      <button class="big-btn" id="retryBtn">🔁 한 번 더</button>
      <button class="ghost-btn" id="homeBtn2">🏠 종목 선택</button>
    </div>
  </div>
</div>

<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, getCursors,
  PoseTracker, PoseMotion, posePoints, isArmRaised,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=4";
import {
  CUTE, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawGloveCursor, drawLevelStars, drawCuteBanner,
} from "../js/cute.js?v=7";
import {
  PARTY, CHARACTERS, Party, drawPartyBackdrop, drawCrowd, drawMascot,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=2";
requestWakeLock();

const UNIT = "n6";
const TITLE = "우주 화물 수송대";
const RECORD_SUFFIX = "개 적재";
const MEDALS = { bronze: 6, silver: 11, gold: 16 };
const CHAR = CHARACTERS[UNIT];
const mode = InputMode.get();
const PI = 3.14;

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(8, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(8, dims.w, dims.h);
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function snap(v, min, max) { return Math.max(min, Math.min(max, Math.round(v))); }
function lerpMap(v, a, b, ra, rb) { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return ra + (rb - ra) * t; }

const volCyl = (r, h) => +(PI * r * r * h).toFixed(2);
const volCone = (r, h) => +((PI * r * r * h) / 3).toFixed(2);
const volSphere = (r) => +((4 / 3) * PI * r * r * r).toFixed(2);
const surfCyl = (r, h) => +(2 * PI * r * r + 2 * PI * r * h).toFixed(2);
function measure(c, metric) {
  if (metric === "S") return surfCyl(c.r, c.h);
  return c.kind === "cone" ? volCone(c.r, c.h) : c.kind === "sphere" ? volSphere(c.r) : volCyl(c.r, c.h);
}

// ---------------------------------------------------------------------------
// 문제 만들기
//
// 예전에는 <부피를 주고 반지름·높이를 역산>하게 했다. 교과서에 없는 유형인 데다
// 두 값을 동시에 더듬느라 한 문제에 15초가 걸려 리듬이 죽었다.
// 이제는 <컨베이어로 흘러오는 화물 셋 중, 요구 수치에 맞는 하나 고르기>다.
// 계산은 공식을 한 번만 쓰면 된다.
// ---------------------------------------------------------------------------
function genRound(level) {
  const metric = level === 3 && Math.random() < 0.5 ? "S" : "V";
  const kinds = level === 1 ? ["cyl", "cyl", "cyl"]
    : level === 2 ? shuffle(["cyl", "cyl", "cone"])
    : metric === "S" ? ["cyl", "cyl", "cyl"] : shuffle(["cyl", "cone", "sphere"]);

  const seen = new Set();
  const cargos = [];
  for (let t = 0; t < 400 && cargos.length < 3; t++) {
    const k = kinds[cargos.length];
    // ⭐1은 3.14 × r × r × h 를 암산할 수 있는 크기로 — r,h 가 5를 넘으면 곱셈만으로 벽이 된다
    const r = level === 1 ? randInt(2, 4) : randInt(2, 7);
    const h = level === 1 ? randInt(2, 4) : randInt(3, 9);
    const c = { r, h, kind: k };
    const v = measure(c, metric);
    if (seen.has(v)) continue;
    seen.add(v);
    cargos.push({ ...c, v });
  }
  while (cargos.length < 3) cargos.push({ r: cargos.length + 2, h: 3, kind: "cyl", v: volCyl(cargos.length + 2, 3) });

  const ansIdx = randInt(0, cargos.length - 1);
  return {
    metric,
    cargos: cargos.map((c, i) => ({ ...c, ok: i === ansIdx })),
    target: cargos[ansIdx].v,
    unitText: metric === "S" ? "cm²" : "cm³",
    formula: metric === "S" ? "겉넓이 = 2×3.14×r×r + 2×3.14×r×h"
      : level === 1 ? "부피 = 3.14 × 반지름 × 반지름 × 높이"
      : level === 2 ? "원뿔의 부피는 같은 원기둥의 3분의 1이에요"
      : "구의 부피 = 4/3 × 3.14 × r × r × r",
    title: metric === "S" ? "포장지 넓이가 맞는 화물은?"
      : level === 1 ? "요구 부피에 맞는 화물을 실어요!"
      : "모양이 섞여 있어요! 잘 보세요",
  };
}

// ── 보너스: 몸으로 원기둥 만들기 (이 종목만의 동작을 특별한 순간으로 남긴다) ──
const R_MIN = 2, R_MAX = 12;
const ARM_MIN = 0.85, ARM_MAX = 2.75;
function genBonus() {
  const r = randInt(3, 8), h = randInt(3, 8);
  return { r0: r, h, target: volCyl(r, h), until: 0, holdMs: 0 };
}

const poseTracker = new PoseTracker();
const motion = new PoseMotion();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await poseTracker.init();
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "우주 화물 수송대",
    lines: [
      "<b>화물 세 개</b>가 컨베이어로 흘러와요. 각 화물에 <b>r</b>과 <b>h</b>가 적혀 있어요!",
      "위에 적힌 <b>요구 부피</b>와 같은 화물을 골라 실으세요.",
      mode === "motion" ? "<b>손을 뻗어 화물에 닿으면</b> 실려요." : "<b>화물을 누르면</b> 실려요.",
      "<b>5연속 성공하면 특대 화물 보너스!</b> 그때는 <b>양팔을 벌려 몸으로</b> 만들어요.",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let round = null, cargos = [], roundAt, resolving = false;
let bonus = null, curR = 5;
let bursts = [];
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;

const NEXT_MS = 320;   // 다음 것이 거의 바로 온다 — 끊기면 리듬이 죽는다
const BELT_Y = 0.62;
const BONUS_MS = 9000;
const BONUS_HOLD = 500;

// 연속 성공을 크게 알려 준다 — 잘하고 있다는 게 눈에 보여야 계속 몸을 쓴다
let streakMsg = null;
function noteStreak(n) {
  if (n >= 3) streakMsg = { text: n >= 10 ? `🔥 ${n}연속 대단해요!` : n >= 5 ? `⚡ ${n}연속!` : `${n}연속!`, until: performance.now() + 1000 };
}
function drawStreak(ctx) {
  if (!streakMsg || performance.now() > streakMsg.until) return;
  const { w, h } = dims;
  const fs = fluidPx(dims, 30, { min: 21, max: 42 });
  const puls = 1 + Math.sin(performance.now() / 110) * 0.09;
  ctx.save();
  ctx.translate(w * 0.5, h * 0.47); ctx.scale(puls, puls);
  drawChunkyText(ctx, streakMsg.text, 0, 0, fs, PARTY.gold,
    { outline: CUTE.ink, outlineWidth: Math.max(4, fs * 0.22) });
  ctx.restore();
}

// ── 도움 표시 ── 두 번 연속 틀리면 다음 문제의 정답을 반짝여 알려 준다.
// 계속 틀리기만 하면 아이는 포기한다. "한 번은 맞혀 보는 경험"이 있어야 다음을 시도한다.
let missStreak = 0;
function helpOn() { return missStreak >= 2; }
function drawHelpRing(ctx, x, y, r) {
  if (!helpOn()) return;
  const t = (performance.now() % 800) / 800;
  ctx.save();
  ctx.globalAlpha = 0.9 * (1 - t * 0.5);
  ctx.strokeStyle = PARTY.gold;
  ctx.lineWidth = Math.max(4, r * 0.22);
  ctx.beginPath();
  ctx.arc(x, y, r * (1.15 + t * 0.35), 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function isSpurt() { return playEndAt - performance.now() < 10000; }
// 화물이 화면을 가로지르는 시간
function beltMs() {
  const base = autoDiff.level === 1 ? 9000 : autoDiff.level === 2 ? 7800 : 6600;
  return base * Math.max(0.6, 1 - party.combo * 0.035) * (isSpurt() ? 0.85 : 1);
}

function newRound() {
  round = genRound(autoDiff.level);
  const dur = beltMs();
  cargos = round.cargos.map((c, i) => ({
    ...c, x: 0, y: 0, at: performance.now() + i * dur * 0.16, dur, taken: false,
  }));
  bursts = [];
  resolving = false;
  motion.reset();
  roundAt = performance.now();
}

function startBonus() {
  bonus = genBonus();
  bonus.until = performance.now() + BONUS_MS;
  curR = 5;
  if (!isMuted()) sound.fever();
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  confetti = []; sparks = [];
  bonus = null;
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function takeCargo(c) {
  if (resolving || c.taken) return;
  c.taken = true;
  resolving = true;
  bursts.push({ x: c.x, y: c.y, at: performance.now(), ok: c.ok });
  shake.trigger(c.ok ? 10 : 6, 190);
  if (c.ok) {
    count++;
    party.correct(c.x, c.y, { base: 11 * (isSpurt() ? 2 : 1), elapsedMs: performance.now() - roundAt });
    if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
    autoDiff.reportCorrect();
    missStreak = 0;
    noteStreak(party.combo);
    autoRec.trigger();
    if (!isMuted()) sound.hit("perfect");
    spawnSparkles(sparks, c.x, c.y, 30, ["#fff", PARTY.gold, CUTE.cyan]);
    // 5연속마다 특대 화물 보너스 — 이 종목만의 "몸으로 만들기"를 여기서만 쓴다
    if (party.combo > 0 && party.combo % 5 === 0) {
      spawnConfetti(confetti, c.x, c.y, 44);
      setTimeout(() => { if (state === "playing") startBonus(); }, NEXT_MS);
      return;
    }
  } else {
    party.wrong(c.x, c.y, `정답은 ${round.target} ${round.unitText}`);
    autoDiff.reportWrong();
    missStreak++;
    if (!isMuted()) sound.wrong();
  }
  setTimeout(() => { if (state === "playing") newRound(); }, NEXT_MS);
}

function missAll() {
  resolving = true;
  party.wrong(dims.w * 0.5, dims.h * BELT_Y, "놓쳤어요!");
  autoDiff.reportWrong();
  if (!isMuted()) sound.wrong();
  setTimeout(() => { if (state === "playing") newRound(); }, NEXT_MS);
}

function endBonus(ok) {
  if (ok) {
    count += 2;
    party.correct(dims.w * 0.5, dims.h * 0.55, { base: 40, elapsedMs: 1000 });
    spawnConfetti(confetti, dims.w * 0.5, dims.h * 0.5, 70);
    shake.trigger(14, 300);
    if (!isMuted()) sound.success();
  } else {
    party.wrong(dims.w * 0.5, dims.h * 0.55, "아쉬워요!");
    if (!isMuted()) sound.wrong();
  }
  bonus = null;
  setTimeout(() => { if (state === "playing") newRound(); }, NEXT_MS);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });
  document.getElementById("statCount").textContent = count + "개";
  document.getElementById("statBest").textContent = best + "개";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽6_우주화물수송대_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽6_우주화물수송대_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});
document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

// ── 손이 화물에 닿았는가 ──
function handPoints() {
  const pts = [];
  if (mode === "motion") {
    const f = motion.last;
    if (f) { pts.push(f.lw, f.rw); }
  } else {
    const down = pointerInput && (pointerInput.down || pointerInput.consumeJustDown());
    if (down && cursors[0]) pts.push(cursors[0]);
  }
  return pts;
}

function checkHits() {
  if (resolving || bonus) return;
  const pts = handPoints();
  if (!pts.length) return;
  const { w, h } = dims;
  const box = Math.min(w * 0.13, h * 0.10);
  for (const c of cargos) {
    if (c.taken || c.x === 0) continue;
    for (const p of pts) {
      if (Math.abs(p.x - c.x) <= box && Math.abs(p.y - c.y) <= box * 1.2) { takeCargo(c); return; }
    }
  }
}

// ── 화물 그림 ──
function drawCargoShape(ctx, kind, cx, cy, rr, hh) {
  const ey = rr * 0.34;
  ctx.save();
  ctx.lineWidth = Math.max(2.5, rr * 0.16);
  ctx.strokeStyle = CUTE.ink;
  ctx.lineJoin = "round";
  ctx.fillStyle = CUTE.cyan;
  if (kind === "sphere") {
    ctx.beginPath(); ctx.arc(cx, cy - rr, rr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy - rr, rr, ey, 0, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.stroke();
  } else if (kind === "cone") {
    ctx.beginPath();
    ctx.moveTo(cx, cy - hh); ctx.lineTo(cx + rr, cy); ctx.lineTo(cx - rr, cy); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, rr, ey, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else {
    const topY = cy - hh;
    ctx.beginPath();
    ctx.moveTo(cx - rr, topY); ctx.lineTo(cx - rr, cy);
    ctx.ellipse(cx, cy, rr, ey, 0, Math.PI, 0, true);
    ctx.lineTo(cx + rr, topY); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, topY, rr, ey, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawBelt(ctx, now) {
  const { w, h } = dims;
  const y = h * BELT_Y;
  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(0, y, w, h * 0.05);
  ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.lineWidth = fluidPx(dims, 3, { min: 2, max: 4.5 });
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  // 흐르는 방향을 알려 주는 빗금
  ctx.globalAlpha = 0.35;
  const step = Math.max(24, w / 22);
  const off = (now / 22) % step;
  for (let x = -step; x < w + step; x += step) {
    ctx.beginPath();
    ctx.moveTo(x - off, y + h * 0.05); ctx.lineTo(x - off + h * 0.05, y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCargos(ctx, now) {
  const { w, h } = dims;
  const unit = Math.min(w * 0.012, h * 0.0095);
  let alive = 0, appeared = 0;
  for (const c of cargos) {
    const t = (now - c.at) / c.dur;
    if (t < 0) continue;
    appeared++;
    if (c.taken || t >= 1) continue;
    alive++;
    // 오른쪽에서 왼쪽으로 흘러간다
    c.x = w + w * 0.16 - (w + w * 0.32) * t;
    c.y = h * BELT_Y;
    const rr = Math.max(unit * 3, c.r * unit * 1.6);
    const hh = Math.max(unit * 5, c.h * unit * 1.9);
    if (c.ok) drawHelpRing(ctx, c.x, c.y - hh * 0.4, Math.max(rr, hh * 0.5));
    drawCargoShape(ctx, c.kind, c.x, c.y, rr, hh);
    const fs = fluidPx(dims, 19, { min: 14, max: 26 });
    const label = c.kind === "sphere" ? `r=${c.r}` : `r=${c.r}  h=${c.h}`;
    drawStickerRect(ctx, c.x, c.y + fs * 1.7, fs * (c.kind === "sphere" ? 3.6 : 6.2), fs * 1.7, fs * 0.45,
      CUTE.cream, { lineWidth: Math.max(2.5, fs * 0.14), drop: fs * 0.16 });
    drawChunkyText(ctx, label, c.x, c.y + fs * 1.7, fs, CUTE.ink, { outline: "#fff", outlineWidth: Math.max(2, fs * 0.14) });
  }
  if (!resolving && appeared === cargos.length && alive === 0) missAll();

  bursts = bursts.filter((b) => now - b.at < 420);
  for (const b of bursts) {
    const t = (now - b.at) / 420;
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.strokeStyle = b.ok ? PARTY.gold : CUTE.red;
    ctx.lineWidth = Math.max(4, w * 0.02 * (1 - t));
    ctx.beginPath(); ctx.arc(b.x, b.y, w * 0.06 * (0.8 + t * 1.8), 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

// ── 보너스 라운드: 몸으로 원기둥 만들기 ──
function stepBonus(ctx, dt, now) {
  const { w, h } = dims;
  const remain = bonus.until - now;
  if (remain <= 0) { endBonus(false); return; }

  // 반지름만 몸으로 만든다 (높이는 고정) — 두 값을 동시에 더듬으면 시간 안에 못 맞춘다
  if (mode === "motion") {
    const f = motion.last;
    if (f) {
      const armUnits = Math.abs(f.rw.x - f.lw.x) / f.unit;
      curR = snap(lerpMap(armUnits, ARM_MIN, ARM_MAX, R_MIN, R_MAX), R_MIN, R_MAX);
    }
  } else if (cursors[0]) {
    curR = snap(lerpMap(cursors[0].x, w * 0.12, w * 0.88, R_MIN, R_MAX), R_MIN, R_MAX);
  }
  const nowV = volCyl(curR, bonus.h);
  const ok = Math.abs(nowV - bonus.target) / bonus.target <= 0.04;
  bonus.holdMs = ok ? bonus.holdMs + dt * 1000 : Math.max(0, bonus.holdMs - dt * 900);
  if (bonus.holdMs >= BONUS_HOLD) { endBonus(true); return; }

  // 화면
  const cx = w * 0.5, baseY = h * 0.78;
  const px = Math.min(w * 0.020, h * 0.016);
  drawCargoShape(ctx, "cyl", cx, baseY, curR * px, bonus.h * px);
  const fs = fluidPx(dims, 26, { min: 18, max: 36 });
  drawStickerRect(ctx, cx, h * 0.34, Math.min(w * 0.86, fs * 17), fs * 3.4, fs * 0.6,
    ok ? CUTE.green : CUTE.cream, { lineWidth: Math.max(3, fs * 0.16), drop: fs * 0.2 });
  drawChunkyText(ctx, `특대 화물  ${bonus.target} cm³ (높이 ${bonus.h} 고정 🔒)`, cx, h * 0.34 - fs * 0.72,
    fs * 0.66, CUTE.ink, { outline: "#fff", outlineWidth: Math.max(2, fs * 0.12) });
  drawChunkyText(ctx, `지금  r=${curR} → ${nowV} cm³`, cx, h * 0.34 + fs * 0.78, fs,
    ok ? "#fff" : CUTE.ink, { outline: ok ? CUTE.ink : "#fff", outlineWidth: Math.max(3, fs * 0.2) });

  const bw = w * 0.6, bh = fluidPx(dims, 11, { min: 8, max: 15 });
  const by = h * 0.46;
  drawStickerRect(ctx, cx, by, bw, bh, bh / 2, "rgba(255,255,255,0.85)", { lineWidth: 2, drop: 0 });
  ctx.save();
  ctx.fillStyle = CUTE.red;
  ctx.beginPath();
  ctx.roundRect(cx - bw / 2, by - bh / 2, Math.max(bh, bw * (remain / BONUS_MS)), bh, bh / 2);
  ctx.fill();
  ctx.restore();

  const tfs = fluidPx(dims, 30, { min: 21, max: 42 });
  const puls = 1 + Math.sin(now / 110) * 0.09;
  ctx.save();
  ctx.translate(cx, h * 0.24); ctx.scale(puls, puls);
  drawChunkyText(ctx, "🔥 특대 화물 보너스!", 0, 0, tfs, PARTY.gold,
    { outline: CUTE.ink, outlineWidth: Math.max(4, tfs * 0.22) });
  ctx.restore();
  drawChunkyText(ctx,
    mode === "motion" ? "양팔을 벌려 반지름을 맞춰요!" : "좌우로 움직여 반지름을 맞춰요!",
    cx, h * 0.94, fluidPx(dims, 17, { min: 13, max: 23 }), "#fff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = poseTracker.detect(video, tsMs);
    motion.push(tsMs, posePoints(result), w, h, video);
    if (state === "raise") {
      if (startGate.update(tsMs, isArmRaised(posePoints(result)))) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  if (mode === "motion") {
    const f = motion.last;
    if (f) {
      const r = fluidPx(dims, 24, { min: 17, max: 33 });
      for (const k of ["lw", "rw"]) {
        drawSticker(ctx, f[k].x, f[k].y, r, PARTY.gold, { lineWidth: Math.max(3, r * 0.15) });
      }
      if (bonus) {
        ctx.save();
        ctx.strokeStyle = PARTY.gold; ctx.globalAlpha = 0.6;
        ctx.lineWidth = Math.max(3, r * 0.3); ctx.setLineDash([r * 0.7, r * 0.6]);
        ctx.beginPath(); ctx.moveTo(f.lw.x, f.lw.y); ctx.lineTo(f.rw.x, f.rw.y); ctx.stroke();
        ctx.restore();
      }
    } else if (state === "playing") {
      drawChunkyText(ctx, "카메라에 두 손이 보이게 서 주세요!", w * 0.5, h * 0.95,
        fluidPx(dims, 20, { min: 15, max: 27 }), "#fff",
        { outline: CUTE.ink, outlineWidth: fluidPx(dims, 6, { min: 4, max: 8 }) });
    }
  } else {
    for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 40, { min: 30, max: 56 }), { active: !resolving });
  }
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "개" });

  if (bonus) {
    stepBonus(ctx, dt, now);
  } else {
    drawBelt(ctx, now);
    drawCargos(ctx, now);
    checkHits();

    drawCuteBanner(ctx, dims, [
      { text: `${round.metric === "S" ? "필요한 겉넓이" : "필요한 부피"}  ${round.target} ${round.unitText}`, size: 27, chunky: true, color: PARTY.gold },
      { text: round.formula, size: 14, color: CUTE.ink },
    ], fluidPx, { top: hudBottom });

    if (remain < 10000) {
      const fs2 = fluidPx(dims, 22, { min: 16, max: 30 });
      const puls = 1 + Math.sin(now / 120) * 0.08;
      ctx.save(); ctx.translate(w * 0.5, h * 0.42); ctx.scale(puls, puls);
      drawChunkyText(ctx, "🔥 라스트 스퍼트! 코인 2배", 0, 0, fs2, CUTE.red,
        { outline: "#fff", outlineWidth: Math.max(4, fs2 * 0.24) });
      ctx.restore();
    }
    drawChunkyText(ctx,
      mode === "motion" ? "손을 뻗어 맞는 화물을 잡아요! 5연속이면 보너스" : "맞는 화물을 눌러요! 5연속이면 보너스",
      w * 0.5, h * 0.965, fluidPx(dims, 14, { min: 11, max: 19 }), "#fff",
      { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });
  }

  const br = fluidPx(dims, 20, { min: 15, max: 27 });
  drawMascot(ctx, w * 0.94, h * 0.30, br, CHAR, party.currentMood(remain));

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  drawStreak(ctx);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);
  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
