<!doctype html>
<html lang="ko">
<head>

<body>

<div class="game-stage">
  <video id="video" playsinline muted style="display:none"></video>
  <canvas id="gameCanvas"></canvas>

  <div class="overlay-panel" id="loadingPanel">
    <h2>🚀 몸으로 원기둥 만들기</h2>

  </div>

  <div class="overlay-panel" id="rulePanel" style="display:none">
    <div class="rule-card">
      <div class="rule-head">
        <div class="rule-char">🛢️</div>
        <div>
          <h2 class="rule-title">몸으로 원기둥 만들기</h2>
        </div>
      </div>
      <ul class="rule-list"></ul>
      <div class="rule-timer"><div class="rule-timer-fill"></div></div>
      <button class="rule-go">좋아, 시작!</button>
    </div>
  </div>

  <div class="overlay-panel" id="raisePanel" style="display:none">
    <div class="raise-icon" id="raiseIcon">🙋</div>

      <div class="stat-box"><div class="num" id="statBest">0개</div><div class="label">최고 기록</div></div>
      <div class="stat-box"><div class="num" id="statCombo">0</div><div class="label">최고 콤보</div></div>

    <div class="action-row">

      <button class="big-btn" id="retryBtn">🔁 한 번 더</button>
      <button class="ghost-btn" id="homeBtn2">🏠 종목 선택</button>
    </div>
  </div>
</div>

<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, getCursors,
  PoseTracker, PoseMotion, posePoints, isArmRaised,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=4";
import {
  CUTE, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawGloveCursor, drawLevelStars, drawCuteBanner,
} from "../js/cute.js?v=7";
import {
  PARTY, Party, drawPartyBackdrop, drawCrowd,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=2";
requestWakeLock();

const UNIT = "n6";
const TITLE = "몸으로 원기둥 만들기";
const RECORD_SUFFIX = "개 성공";
const MEDALS = { bronze: 6, silver: 11, gold: 16 };
const mode = InputMode.get();
const PI = 3.14;

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(8, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(8, dims.w, dims.h);
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function snap(v, min, max) { return Math.max(min, Math.min(max, Math.round(v))); }
function lerpMap(v, a, b, ra, rb) { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return ra + (rb - ra) * t; }

const volCyl = (r, h) => +(PI * r * r * h).toFixed(2);
const volCone = (r, h) => +((PI * r * r * h) / 3).toFixed(2);
// ---------------------------------------------------------------------------
// 문제 만들기 — 「몸으로 원기둥을 만든다」
//
// 예전에는 <필요한 부피 113.04cm³ 에 맞는 화물 고르기>였다. 그 값은
// 3.14 × 3 × 3 × 4 다. 곱셈 세 번에 소수점 처리까지, 종이 없이는 못 한다.
//
// 그래서 3.14 를 아이가 곱하지 않게 문제를 뒤집었다.
//   "반지름 2 인 원기둥의 부피가 20 × 3.14. 높이를 만들어라"  →  4 × ? = 20  →  5
// 계산은 나눗셈 한 번이고, 답은 <높이라는 길이>다.
// 반지름은 양팔 너비로, 높이는 앉은 키로 만든다.
// ---------------------------------------------------------------------------
const R_MIN = 1, R_MAX = 6;    // 반지름 눈금 (양팔 너비)
const H_MIN = 1, H_MAX = 6;    // 높이 눈금 (앉은 키)

function genRound(level) {
  if (level === 1) {
    // ⭐1 — 반지름을 고정해 주고 높이만 만든다. 나눗셈 한 번.
    const r = randInt(1, 3), h = randInt(2, H_MAX);
    return {
      kind: "cyl", lock: "r", r, h,
      ask: `부피가 ${r * r * h} × 3.14 인 원기둥을 만들어요!`,
      sub: `반지름 ${r} 🔒 — 높이를 맞춰요`,
      hint: "부피 = 반지름 × 반지름 × 높이 × 3.14",
      show: `${r} × ${r} × ${h} = ${r * r * h}`,
    };
  }
  if (level === 2) {
    // ⭐2 — 높이를 고정해 주고 반지름을 만든다. 나눗셈 뒤 곱셈구구를 거꾸로.
    const r = randInt(2, R_MAX), h = randInt(1, 3);
    return {
      kind: "cyl", lock: "h", r, h,
      ask: `부피가 ${r * r * h} × 3.14 인 원기둥을 만들어요!`,
      sub: `높이 ${h} 🔒 — 반지름을 맞춰요`,
      hint: "반지름 × 반지름 이 얼마여야 할까요?",
      show: `${r} × ${r} × ${h} = ${r * r * h}`,
    };
  }
  // ⭐3 — 원뿔은 같은 원기둥의 3분의 1. 같은 부피를 내려면 높이가 3배여야 한다.
  const r = randInt(1, 3), hCyl = randInt(1, 2);
  return {
    kind: "cone", lock: "r", r, h: hCyl * 3,
    ask: `반지름 ${r}, 높이 ${hCyl} 인 원기둥과 부피가 같은 원뿔을 만들어요!`,
    sub: `반지름 ${r} 🔒 — 높이를 맞춰요`,
    hint: "원뿔의 부피는 같은 원기둥의 3분의 1이에요",
    show: `높이 ${hCyl} × 3 = ${hCyl * 3}`,
  };
}

// 5연속 보너스 — 계산은 없다. 두 값을 동시에 몸으로 만들면 된다.
function genBonus() {
  return { r: randInt(2, R_MAX), h: randInt(2, H_MAX), until: 0, holdMs: 0 };
}

const poseTracker = new PoseTracker();
const motion = new PoseMotion();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await poseTracker.init();
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "몸으로 원기둥 만들기",
    lines: [
      "<b>양팔을 벌린 너비 = 반지름</b>, <b>앉은 키 = 높이</b>예요!",
      "<b>3.14는 곱하지 않아도 돼요.</b> 부피가 20×3.14면 반지름 2일 때 <b>4 × ? = 20</b>!",
      "<b>🔒 가 붙은 값은 고정</b>이에요. 나머지 하나만 몸으로 맞추면 돼요.",
      "맞는 값에서 <b>잠깐만 멈추면</b> 성공! <b>5연속이면 보너스</b>가 나와요.",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let round = null, roundAt, resolving = false;
let bonus = null;
let curR = 3, curH = 3;     // 지금 몸으로 만들고 있는 반지름·높이
let holdMs = 0;
let smoothArm = 1.6, smoothDepth = 0;
let okFlash = 0;
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;

const NEXT_MS = 500;
const BASE_Y = 0.80;        // 원기둥이 서 있는 바닥
const HOLD_MS = 340;        // 맞는 값에 이만큼 머물면 성공
const BONUS_MS = 9000;

// 양팔 너비 → 반지름 (어깨 너비의 몇 배인지로 재므로 카메라 거리와 무관)
const ARM_MIN = 0.75, ARM_MAX = 2.70;
// 앉은 깊이 → 높이. 서 있으면 가장 높고, 깊이 앉으면 가장 낮다 — 몸이 곧 원기둥이다.
const SQUAT_DEEP = 0.45;    // 어깨가 어깨 너비의 45%만큼 내려가면 가장 낮은 칸

// 연속 성공을 크게 알려 준다
let streakMsg = null;
function noteStreak(n) {
  if (n >= 3) streakMsg = { text: n >= 10 ? `🔥 ${n}연속 대단해요!` : n >= 5 ? `⚡ ${n}연속!` : `${n}연속!`, until: performance.now() + 1000 };
}
function drawStreak(ctx) {
  if (!streakMsg || performance.now() > streakMsg.until) return;
  const { w, h } = dims;
  const fs = fluidPx(dims, 30, { min: 21, max: 42 });
  const puls = 1 + Math.sin(performance.now() / 110) * 0.09;
  ctx.save();
  ctx.translate(w * 0.5, h * 0.44); ctx.scale(puls, puls);
  drawChunkyText(ctx, streakMsg.text, 0, 0, fs, PARTY.gold,
    { outline: CUTE.ink, outlineWidth: Math.max(4, fs * 0.22) });
  ctx.restore();
}

let missStreak = 0;
function helpOn() { return missStreak >= 2; }

function isSpurt() { return playEndAt - performance.now() < 10000; }
function roundMs() {
  return autoDiff.level === 1 ? 12000 : autoDiff.level === 2 ? 10500 : 9000;
}

// ── 몸 읽기 ──
// 서 있을 때의 어깨 높이를 기준선으로 삼는다. 무릎·발목은 교실 화각에서 자주 잘리지만
// 어깨는 거의 항상 보인다. 아이가 카메라에 다가서면 기준선이 천천히 따라간다.
const stand = { y: null };
function resetBody() { stand.y = null; smoothArm = 1.6; smoothDepth = 0; }

function readBody(dt) {
  if (mode === "motion") {
    const f = motion.last;
    if (!f) return;
    const units = Math.hypot(f.rw.x - f.lw.x, f.rw.y - f.lw.y) / f.unit;
    smoothArm += (units - smoothArm) * Math.min(1, dt * 9);
    if (stand.y === null || f.sc.y < stand.y) stand.y = f.sc.y;
    else stand.y += (f.sc.y - stand.y) * 0.0012;
    const depth = (f.sc.y - stand.y) / f.unit;
    smoothDepth += (depth - smoothDepth) * Math.min(1, dt * 9);
    curR = snap(lerpMap(smoothArm, ARM_MIN, ARM_MAX, R_MIN, R_MAX), R_MIN, R_MAX);
    curH = snap(lerpMap(smoothDepth, SQUAT_DEEP, 0, H_MIN, H_MAX), H_MIN, H_MAX);
  } else if (cursors[0]) {
    curR = snap(lerpMap(cursors[0].x, dims.w * 0.12, dims.w * 0.88, R_MIN, R_MAX), R_MIN, R_MAX);
    curH = snap(lerpMap(cursors[0].y, dims.h * 0.86, dims.h * 0.22, H_MIN, H_MAX), H_MIN, H_MAX);
  }
  // 고정된 값은 몸으로 바꾸지 않는다 — 한 번에 한 축만 맞추게 해야 시간 안에 된다
  if (!bonus && round) {
    if (round.lock === "r") curR = round.r;
    if (round.lock === "h") curH = round.h;
  }
}

function newRound() {
  round = genRound(autoDiff.level);
  round.ms = roundMs();
  holdMs = 0;
  resolving = false;
  motion.reset();
  roundAt = performance.now();
}

function succeed() {
  resolving = true;
  count++;
  const { w, h } = dims;
  const cx = w * 0.5, cy = h * 0.55;
  party.correct(cx, cy, { base: 13 * (isSpurt() ? 2 : 1), elapsedMs: performance.now() - roundAt });
  if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
  autoDiff.reportCorrect();
  missStreak = 0;
  noteStreak(party.combo);
  autoRec.trigger();
  shake.trigger(10, 220);
  if (!isMuted()) sound.hit("perfect");
  spawnSparkles(sparks, cx, cy, 32, ["#fff", PARTY.gold, CUTE.cyan]);
  okFlash = performance.now() + 900;
  if (party.combo > 0 && party.combo % 5 === 0) {
    spawnConfetti(confetti, cx, cy, 44);
    setTimeout(() => { if (state === "playing") startBonus(); }, NEXT_MS);
    return;
  }
  setTimeout(() => { if (state === "playing") newRound(); }, NEXT_MS);
}

function timeUp() {
  if (resolving) return;
  resolving = true;
  const want = round.lock === "r" ? `높이 ${round.h}` : `반지름 ${round.r}`;
  party.wrong(dims.w * 0.5, dims.h * 0.45, `정답은 ${want}`);
  autoDiff.reportWrong();
  missStreak++;
  if (!isMuted()) sound.wrong();
  setTimeout(() => { if (state === "playing") newRound(); }, NEXT_MS);
}

function startBonus() {
  bonus = genBonus();
  bonus.until = performance.now() + BONUS_MS;
  holdMs = 0;
  if (!isMuted()) sound.fever();
}

function endBonus(ok) {
  bonus = null;
  if (ok) {
    count += 2;
    party.correct(dims.w * 0.5, dims.h * 0.5, { base: 40, elapsedMs: 1000 });
    spawnConfetti(confetti, dims.w * 0.5, dims.h * 0.5, 60);
    if (!isMuted()) sound.success();
  } else {
    party.judge(dims.w * 0.5, dims.h * 0.5, "아쉬워요!", CUTE.blue);
  }
  setTimeout(() => { if (state === "playing") newRound(); }, NEXT_MS);
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  confetti = []; sparks = [];
  bonus = null;
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  resetBody();
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });
  document.getElementById("statCount").textContent = count + "개";
  document.getElementById("statBest").textContent = best + "개";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽6_원기둥만들기_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽6_원기둥만들기_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});
document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

// ── 화물 그림 ──
function drawCargoShape(ctx, kind, cx, cy, rr, hh, fill = CUTE.cyan) {
  const ey = rr * 0.34;
  ctx.save();
  ctx.lineWidth = Math.max(2.5, rr * 0.16);
  ctx.strokeStyle = CUTE.ink;
  ctx.lineJoin = "round";
  ctx.fillStyle = fill;
  if (kind === "sphere") {
    ctx.beginPath(); ctx.arc(cx, cy - rr, rr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy - rr, rr, ey, 0, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,0.75)"; ctx.stroke();
  } else if (kind === "cone") {
    ctx.beginPath();
    ctx.moveTo(cx, cy - hh); ctx.lineTo(cx + rr, cy); ctx.lineTo(cx - rr, cy); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, rr, ey, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else {
    const topY = cy - hh;
    ctx.beginPath();
    ctx.moveTo(cx - rr, topY); ctx.lineTo(cx - rr, cy);
    ctx.ellipse(cx, cy, rr, ey, 0, Math.PI, 0, true);
    ctx.lineTo(cx + rr, topY); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, topY, rr, ey, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawFloor(ctx) {
  const { w, h } = dims;
  const y = h * BASE_Y;
  ctx.save();
  ctx.fillStyle = "rgba(255,255,255,0.16)";
  ctx.fillRect(0, y, w, h - y);
  ctx.strokeStyle = "rgba(255,255,255,0.8)";
  ctx.lineWidth = fluidPx(dims, 4, { min: 3, max: 6 });
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  ctx.restore();
}

// 화면에서 1칸이 몇 px 인가 — 반지름 6·높이 6 이 화면에 들어와야 한다
function unitPx() { return Math.min(dims.w * 0.055, dims.h * 0.070); }

// 내가 몸으로 만들고 있는 원기둥(또는 원뿔)
function drawMySolid(ctx, now) {
  const { w, h } = dims;
  const px = unitPx();
  const cx = w * 0.5, baseY = h * BASE_Y;
  const kind = bonus ? "cyl" : round.kind;
  const okR = bonus ? curR === bonus.r : curR === round.r;
  const okH = bonus ? curH === bonus.h : curH === round.h;
  const done = okR && okH;

  drawCargoShape(ctx, kind, cx, baseY, curR * px, curH * px, done ? CUTE.green : CUTE.cyan);

  // 반지름·높이 눈금 값 — 숫자는 이 둘만 보여 준다.
  // 부피를 실시간으로 계산해 띄우면 아이는 숫자가 같아질 때까지 움직이기만 하면 되고,
  // 수학은 하나도 하지 않게 된다.
  const fs = fluidPx(dims, 19, { min: 14, max: 26 });
  const rLock = !bonus && round.lock === "r";
  const hLock = !bonus && round.lock === "h";
  // 반지름 — 밑면 옆에
  drawStickerRect(ctx, cx, baseY + fs * 1.8, fs * 7.4, fs * 1.7, fs * 0.45,
    rLock ? "rgba(255,255,255,0.75)" : okR ? CUTE.green : CUTE.cream,
    { lineWidth: Math.max(2.5, fs * 0.14), drop: fs * 0.16 });
  drawChunkyText(ctx, `${rLock ? "🔒 " : ""}반지름 ${curR}`, cx, baseY + fs * 1.8, fs,
    okR && !rLock ? "#fff" : CUTE.ink, { outline: okR && !rLock ? CUTE.ink : "#fff", outlineWidth: Math.max(2, fs * 0.13) });
  // 높이 — 기둥 옆에
  const hy = baseY - curH * px * 0.5;
  drawStickerRect(ctx, cx + curR * px + fs * 3.2, hy, fs * 6.0, fs * 1.7, fs * 0.45,
    hLock ? "rgba(255,255,255,0.75)" : okH ? CUTE.green : CUTE.cream,
    { lineWidth: Math.max(2.5, fs * 0.14), drop: fs * 0.16 });
  drawChunkyText(ctx, `${hLock ? "🔒 " : ""}높이 ${curH}`, cx + curR * px + fs * 3.2, hy, fs,
    okH && !hLock ? "#fff" : CUTE.ink, { outline: okH && !hLock ? CUTE.ink : "#fff", outlineWidth: Math.max(2, fs * 0.13) });

  // 다 맞은 동안 차오르는 고리
  if (done && holdMs > 0) {
    ctx.save();
    ctx.strokeStyle = PARTY.gold;
    ctx.lineWidth = fluidPx(dims, 9, { min: 6, max: 14 });
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(cx, baseY - curH * px * 0.5, Math.max(curR * px, curH * px * 0.6) + fluidPx(dims, 14, { min: 10, max: 20 }),
      -Math.PI / 2, -Math.PI / 2 + (holdMs / HOLD_MS) * Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // 두 번 연속 틀리면 만들어야 할 값을 알려 준다
  if (!bonus && helpOn() && !resolving) {
    const want = round.lock === "r" ? `높이 ${round.h}` : `반지름 ${round.r}`;
    const gfs = fluidPx(dims, 18, { min: 13, max: 24 });
    const t = (now % 800) / 800;
    ctx.save();
    ctx.globalAlpha = 0.9 * (1 - t * 0.5);
    drawChunkyText(ctx, `👉 ${want} 로 만들어요`, cx, baseY - curH * px - gfs * 2.4, gfs, PARTY.gold,
      { outline: CUTE.ink, outlineWidth: Math.max(3, gfs * 0.22) });
    ctx.restore();
  }

  // 성공 직후에만 식을 보여 준다
  if (!bonus && now < okFlash) {
    const efs = fluidPx(dims, 21, { min: 15, max: 29 });
    drawChunkyText(ctx, `✓ ${round.show}`, cx, baseY - curH * px - efs * 1.4, efs, PARTY.gold,
      { outline: CUTE.ink, outlineWidth: Math.max(3, efs * 0.22) });
  }
}

// ── 보너스 라운드 — 계산 없이 두 값을 동시에 몸으로 만든다 ──
function stepBonus(ctx, dt, now) {
  const { w, h } = dims;
  const remain = bonus.until - now;
  if (remain <= 0) { endBonus(false); return; }

  readBody(dt);
  const done = curR === bonus.r && curH === bonus.h;
  holdMs = done ? holdMs + dt * 1000 : Math.max(0, holdMs - dt * 1400);
  if (holdMs >= HOLD_MS) { endBonus(true); return; }

  drawFloor(ctx);
  drawMySolid(ctx, now);

  const tfs = fluidPx(dims, 28, { min: 20, max: 39 });
  const puls = 1 + Math.sin(now / 110) * 0.09;
  ctx.save();
  ctx.translate(w * 0.5, h * 0.22); ctx.scale(puls, puls);
  drawChunkyText(ctx, `🔥 보너스! 반지름 ${bonus.r} · 높이 ${bonus.h}`, 0, 0, tfs, PARTY.gold,
    { outline: CUTE.ink, outlineWidth: Math.max(4, tfs * 0.22) });
  ctx.restore();

  const bw = w * 0.5, bh = fluidPx(dims, 11, { min: 8, max: 15 });
  const by = h * 0.30;
  drawStickerRect(ctx, w * 0.5, by, bw, bh, bh / 2, "rgba(255,255,255,0.85)", { lineWidth: 2, drop: 0 });
  ctx.save();
  ctx.fillStyle = CUTE.red;
  ctx.beginPath();
  ctx.roundRect(w * 0.5 - bw / 2, by - bh / 2, Math.max(bh, bw * (remain / BONUS_MS)), bh, bh / 2);
  ctx.fill();
  ctx.restore();
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = poseTracker.detect(video, tsMs);
    motion.push(tsMs, posePoints(result), w, h, video);
    if (state === "raise") {
      if (startGate.update(tsMs, isArmRaised(posePoints(result)))) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  if (mode === "motion") {
    const f = motion.last;
    if (f) {
      const r = fluidPx(dims, 24, { min: 17, max: 33 });
      for (const k of ["lw", "rw"]) {
        drawSticker(ctx, f[k].x, f[k].y, r, PARTY.gold, { lineWidth: Math.max(3, r * 0.15) });
      }
      // 두 손을 잇는 선 — 이 길이가 곧 반지름이다
      ctx.save();
      ctx.strokeStyle = PARTY.gold; ctx.globalAlpha = 0.6;
      ctx.lineWidth = Math.max(3, r * 0.3); ctx.setLineDash([r * 0.7, r * 0.6]);
      ctx.beginPath(); ctx.moveTo(f.lw.x, f.lw.y); ctx.lineTo(f.rw.x, f.rw.y); ctx.stroke();
      ctx.restore();
    } else if (state === "playing") {
      drawChunkyText(ctx, "카메라에 온몸이 보이게 2~3걸음 물러서 주세요!", w * 0.5, h * 0.95,
        fluidPx(dims, 20, { min: 15, max: 27 }), "#fff",
        { outline: CUTE.ink, outlineWidth: fluidPx(dims, 6, { min: 4, max: 8 }) });
    }
  } else {
    for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 40, { min: 30, max: 56 }), { active: !resolving });
  }
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "개" });

  if (bonus) {
    stepBonus(ctx, dt, now);
  } else {
    if (!resolving) {
      readBody(dt);
      // 두 값이 다 맞은 채로 잠깐 머물면 성공
      if (curR === round.r && curH === round.h) {
        holdMs += dt * 1000;
        if (holdMs >= HOLD_MS) succeed();
      } else {
        holdMs = Math.max(0, holdMs - dt * 1400);
      }
    }

    drawFloor(ctx);
    drawMySolid(ctx, now);

    // 이 문제에 남은 시간 띠
    if (!resolving) {
      const t = Math.max(0, 1 - (now - roundAt) / round.ms);
      const bw = w * 0.44, bh = fluidPx(dims, 9, { min: 6, max: 13 });
      const by = h * 0.315;
      drawStickerRect(ctx, w * 0.5, by, bw, bh, bh / 2, "rgba(255,255,255,0.8)", { lineWidth: 2, drop: 0 });
      ctx.save();
      ctx.fillStyle = t < 0.3 ? CUTE.red : PARTY.gold;
      ctx.beginPath();
      ctx.roundRect(w * 0.5 - bw / 2, by - bh / 2, Math.max(bh, bw * t), bh, bh / 2);
      ctx.fill();
      ctx.restore();
      if (t <= 0) timeUp();
    }

    drawCuteBanner(ctx, dims, [
      { text: round.ask, size: 23, chunky: true, color: PARTY.gold },
      { text: `${round.sub} · ${round.hint}`, size: 14, color: CUTE.ink },
    ], fluidPx, { top: hudBottom });

    if (remain < 10000) {
      const fs2 = fluidPx(dims, 21, { min: 15, max: 29 });
      const puls = 1 + Math.sin(now / 120) * 0.08;
      ctx.save(); ctx.translate(w * 0.5, h * 0.37); ctx.scale(puls, puls);
      drawChunkyText(ctx, "🔥 라스트 스퍼트! 코인 2배", 0, 0, fs2, CUTE.red,
        { outline: "#fff", outlineWidth: Math.max(4, fs2 * 0.24) });
      ctx.restore();
    }
    drawChunkyText(ctx,
      mode === "motion" ? "양팔 = 반지름 · 앉은 키 = 높이!" : "좌우 = 반지름 · 위아래 = 높이!",
      w * 0.5, h * 0.965, fluidPx(dims, 14, { min: 11, max: 19 }), "#fff",
      { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });
  }

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  drawStreak(ctx);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);
  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
