<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>비례 줄다리기 · 종목 4</title>
<link rel="stylesheet" href="../css/style.css?v=6">
</head>
<body>

<div class="game-stage">
  <video id="video" playsinline muted style="display:none"></video>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="rec" id="recIndicator" style="display:none"><span class="dot"></span>REC</div>
    <button class="home-btn" id="homeBtn">🏠</button>
  </div>

  <div class="overlay-panel" id="loadingPanel">
    <h2>🪢 비례 줄다리기</h2>
    <p id="loadingText">준비 중…</p>
  </div>

  <div class="overlay-panel" id="rulePanel" style="display:none">
    <div class="rule-card">
      <div class="rule-head">
        <div class="rule-char">🪢</div>
        <div>
          <h2 class="rule-title">비례 줄다리기</h2>
        </div>
      </div>
      <ul class="rule-list"></ul>
      <div class="rule-timer"><div class="rule-timer-fill"></div></div>
      <button class="rule-go">좋아, 시작!</button>
    </div>
  </div>

  <div class="overlay-panel" id="raisePanel" style="display:none">
    <div class="raise-icon" id="raiseIcon">🙋</div>
    <h2 id="raiseText">손을 들어 주세요!</h2>
    <div class="hold-bar"><div class="hold-fill" id="holdFill"></div></div>
  </div>

  <div class="overlay-panel ready-flash" id="readyPanel" style="display:none">
    <h2>✋ 좋아요! 준비됐어요</h2>
  </div>

  <div class="overlay-panel" id="countdownPanel" style="display:none">
    <div class="countdown-num" id="countNum">3</div>
  </div>

  <div class="overlay-panel" id="resultPanel" style="display:none">
    <div id="podium"></div>
    <div class="result-stats">
      <div class="stat-box"><div class="num" id="statCount">0점</div><div class="label">나눈 줄</div></div>
      <div class="stat-box"><div class="num" id="statBest">0점</div><div class="label">최고 기록</div></div>
      <div class="stat-box"><div class="num" id="statCombo">0</div><div class="label">최고 콤보</div></div>
    </div>
    <video class="preview" id="previewVideo" controls playsinline style="display:none"></video>
    <div class="action-row">
      <button class="ghost-btn" id="savePhotoBtn">📸 사진</button>
      <button class="ghost-btn" id="saveVideoBtn" style="display:none">🎬 3초 영상</button>
      <button class="big-btn" id="retryBtn">🔁 한 번 더</button>
      <button class="ghost-btn" id="homeBtn2">🏠 종목 선택</button>
    </div>
  </div>
</div>

<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, getCursors,
  PoseTracker, PoseMotion, posePoints, isArmRaised,
  AutoDifficulty, levelFromUrl, medalFor,
  scheduleAutoRecording, ComboShot, drawPhotoOverlay,
  ScreenShake, InputMode, PointerInput, StartGate,
  startCamera, formatFileTimestamp, fluidPx, showSoundHint,
  drawVignette, spawnConfetti, updateConfetti, drawConfetti,
} from "../js/engine.js?v=4";
import {
  CUTE, drawSticker, drawStickerRect, drawChunkyText,
  spawnSparkles, updateSparkles, drawSparkles, makeDrifters, drawDrifters,
  drawBunting, drawLevelStars, drawCuteBanner,
} from "../js/cute.js?v=7";
import {
  PARTY, Party, drawPartyBackdrop, drawCrowd,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=2";
requestWakeLock();

const UNIT = "n4";
const TITLE = "비례 줄다리기";
const RECORD_SUFFIX = "개 성공";
const MEDALS = { bronze: 5, silver: 9, gold: 14 };
const mode = InputMode.get();

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(6, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(6, dims.w, dims.h);
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------------------------------------------------------------------------
// 코트 — 피카츄 배구처럼 <옆에서 본 화면>이다.
// 왼쪽이 상대 코트, 오른쪽이 내 코트, 가운데가 네트.
// 상대 코트 바닥은 앞·중간·뒤 세 구역으로 나뉘고 각 구역에 분수가 적혀 있다.
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// 「비례 줄다리기」
//
// 예전에는 배구 코트에서 <답이 적힌 칸>으로 공을 내리꽂게 했다. 그런데 조준이
// "어디에 서 있느냐"일 뿐이어서, 비례배분과 몸의 움직임이 아무 상관이 없었다.
// 계산해서 답을 확인하고 그 자리를 <지목>하는 것뿐이었다.
//
// 이제는 구슬 한 줄을 놓고 <내 몸이 곧 경계선>이다. 자리를 옮기면 왼쪽과 오른쪽
// 개수가 함께 바뀐다. 아이는 몸을 움직이면서 "전체를 몇 묶음으로 나눠 몇 묶음씩"을
// 눈으로 본다. 비례배분의 뜻 그 자체가 몸의 위치가 된다.
// ---------------------------------------------------------------------------
const LINE_LEFT = 0.10, LINE_RIGHT = 0.90;   // 구슬 줄이 놓이는 가로 범위
const ROW_Y = 0.56;                          // 구슬 줄의 높이

function pickRatio(maxParts) {
  for (let i = 0; i < 200; i++) {
    let a = randInt(1, 5), b = randInt(1, 5);
    const g = gcd(a, b); a /= g; b /= g;
    if (a === b) continue;
    if (a + b <= maxParts) return { a, b };
  }
  return { a: 1, b: 2 };
}

// 숫자 뒤에 붙는 「을/를」과 「로/으로」 — 끝자리를 한글로 읽었을 때의 받침으로 고른다.
// 그냥 "을"로 박아 두면 "12을 3:1로 나누면" 처럼 틀린 말이 화면에 뜬다.
const HAS_BATCHIM = [true, true, false, true, false, false, true, true, true, false];
function eul(n) { return HAS_BATCHIM[n % 10] ? "을" : "를"; }
const RO_PLAIN = [false, true, true, false, true, true, false, true, true, true];
function ro(n) { return RO_PLAIN[n % 10] ? "로" : "으로"; }

function genRound(level) {
  // ⭐1은 전체 12 이하 — 한 칸이 화면에서 충분히 크고 눈으로 셀 수 있다
  const maxTotal = level === 1 ? 12 : 18;
  const maxParts = level === 1 ? 4 : 6;
  const { a, b } = pickRatio(maxParts);
  const parts = a + b;
  const k = randInt(2, Math.max(2, Math.floor(maxTotal / parts)));
  const total = parts * k;

  if (level === 2) {
    // ⭐2 — 비를 간단히 해야 한다. 배수는 전체를 넘지 않게 잡는다.
    const m = randInt(2, Math.max(2, Math.min(4, k)));
    return {
      total, parts, each: k, left: a * k,
      text: `${total}${eul(total)} ${a * m} : ${b * m}${ro(b * m)} 나누어요!`,
      hint: `${a * m} : ${b * m}${eul(b * m)} 간단히 하면 ${a} : ${b}예요`,
      show: `${total} ÷ ${parts} = ${k} · 왼쪽 ${a}묶음 = ${a * k}`,
    };
  }
  return {
    total, parts, each: k, left: a * k,
    text: `${total}${eul(total)} ${a} : ${b}${ro(b)} 나누어요!`,
    hint: `전체를 ${parts}묶음으로 나누고 왼쪽이 ${a}묶음이에요`,
    show: `${total} ÷ ${parts} = ${k} · 왼쪽 ${a}묶음 = ${a * k}`,
  };
}

const poseTracker = new PoseTracker();
const motion = new PoseMotion();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await poseTracker.init();
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "비례 줄다리기",
    lines: [
      "구슬 한 줄을 <b>비율대로 나누는</b> 게임이에요!",
      mode === "motion" ? "<b>내 몸이 곧 경계선</b>이에요. 좌우로 걸어가 보세요."
        : "<b>커서가 곧 경계선</b>이에요. 좌우로 움직여 보세요.",
      "<b>2 : 1</b> 이면 전체를 <b>3묶음</b>으로 나누고 왼쪽이 <b>2묶음</b>!",
      "맞는 자리에서 <b>잠깐만 멈추면</b> 성공이에요.",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let round = null, roundAt, resolving = false;
let lineX = 0;        // 지금 내 몸이 만든 경계선
let holdMs = 0;
let okFlash = 0;
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;

// party 의 판정 문구가 화면 끝에서 잘리지 않게 안쪽으로 당긴다
function safeX(x) { return Math.max(dims.w * 0.26, Math.min(dims.w * 0.74, x)); }

// ── 연속 성공 자막 ──
let streakMsg = null;
function noteStreak(n) {
  if (n >= 3) streakMsg = { text: n >= 10 ? `🔥 ${n}연속 대단해요!` : n >= 5 ? `⚡ ${n}연속!` : `${n}연속!`, until: performance.now() + 1100 };
}
function drawStreak(ctx) {
  if (!streakMsg || performance.now() > streakMsg.until) return;
  const { w, h } = dims;
  const fs = fluidPx(dims, 30, { min: 21, max: 42 });
  const puls = 1 + Math.sin(performance.now() / 110) * 0.09;
  ctx.save();
  ctx.translate(w * 0.5, h * 0.40); ctx.scale(puls, puls);
  drawChunkyText(ctx, streakMsg.text, 0, 0, fs, PARTY.gold,
    { outline: CUTE.ink, outlineWidth: Math.max(4, fs * 0.22) });
  ctx.restore();
}

// ── 도움 표시 ── 두 번 연속 틀리면 묶음 경계를 회색으로 알려 준다
let missStreak = 0;
function helpOn() { return missStreak >= 2; }

function isSpurt() { return playEndAt - performance.now() < 10000; }
function roundMs() {
  return autoDiff.level === 1 ? 13000 : autoDiff.level === 2 ? 11000 : 9500;
}

const HOLD_MS = 360;   // 맞는 자리에 이만큼 서 있으면 성공
const NEXT_MS = 550;

// 구슬 i 의 화면 x
function marbleX(i, total) {
  const { w } = dims;
  const x0 = w * LINE_LEFT, x1 = w * LINE_RIGHT;
  return total <= 1 ? (x0 + x1) / 2 : x0 + ((x1 - x0) * i) / (total - 1);
}

// 경계선보다 왼쪽에 있는 구슬 개수
function leftCount(lineX) {
  let n = 0;
  for (let i = 0; i < round.total; i++) if (marbleX(i, round.total) < lineX) n++;
  return n;
}

function newRound() {
  round = genRound(autoDiff.level);
  round.ms = roundMs();
  holdMs = 0;
  resolving = false;
  motion.reset();
  roundAt = performance.now();
}

function succeed() {
  resolving = true;
  count++;
  const { w, h } = dims;
  party.correct(safeX(lineX), h * ROW_Y, { base: 13 * (isSpurt() ? 2 : 1), elapsedMs: performance.now() - roundAt });
  if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
  autoDiff.reportCorrect();
  missStreak = 0;
  noteStreak(party.combo);
  autoRec.trigger();
  shake.trigger(10, 220);
  if (!isMuted()) sound.hit("perfect");
  spawnSparkles(sparks, lineX, h * ROW_Y, 32, ["#fff", PARTY.gold, CUTE.orange]);
  if (party.combo > 0 && party.combo % 5 === 0) {
    spawnConfetti(confetti, lineX, h * ROW_Y, 44);
    if (!isMuted()) sound.fever();
  }
  okFlash = performance.now() + 1000;
  setTimeout(() => { if (state === "playing") newRound(); }, NEXT_MS);
}

function timeUp() {
  if (resolving) return;
  resolving = true;
  party.wrong(dims.w * 0.5, dims.h * 0.42, `정답은 왼쪽 ${round.left}개`);
  autoDiff.reportWrong();
  missStreak++;
  if (!isMuted()) sound.wrong();
  setTimeout(() => { if (state === "playing") newRound(); }, NEXT_MS);
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0; missStreak = 0;
  party.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  lineX = dims.w * 0.5;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });
  document.getElementById("statCount").textContent = count + "개";
  document.getElementById("statBest").textContent = best + "개";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽6_비례줄다리기_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽6_비례줄다리기_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});
document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

// ── 내 몸이 경계선이다 ──
function readBody(dt) {
  const { w } = dims;
  let px = null;
  if (mode === "motion") {
    const f = motion.last;
    if (f) px = f.sc.x;
  } else if (cursors[0]) {
    px = cursors[0].x;
  }
  if (px !== null) {
    const target = Math.max(w * 0.04, Math.min(w * 0.96, px));
    lineX += (target - lineX) * Math.min(1, dt * 12);
  }
}

// ── 구슬 줄과 경계선 ──
function drawRope(ctx, now) {
  const { w, h } = dims;
  const y = h * ROW_Y;
  const r = Math.min(w * 0.026, h * 0.038);
  const left = leftCount(lineX);
  const hit = !resolving && left === round.left;

  // 줄
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = fluidPx(dims, 6, { min: 4, max: 9 });
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(w * LINE_LEFT - r, y); ctx.lineTo(w * LINE_RIGHT + r, y); ctx.stroke();
  ctx.restore();

  // 두 번 연속 틀리면 묶음 경계를 회색 점선으로 알려 준다
  if (helpOn() && !resolving) {
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = fluidPx(dims, 2.5, { min: 2, max: 4 });
    ctx.setLineDash([6, 6]);
    for (let g = 1; g < round.parts; g++) {
      const i = g * round.each;
      const x = (marbleX(i - 1, round.total) + marbleX(i, round.total)) / 2;
      ctx.beginPath(); ctx.moveTo(x, y - r * 2.4); ctx.lineTo(x, y + r * 2.4); ctx.stroke();
    }
    ctx.restore();
  }

  // 구슬 — 경계선 왼쪽은 파랑, 오른쪽은 주황
  for (let i = 0; i < round.total; i++) {
    const x = marbleX(i, round.total);
    drawSticker(ctx, x, y, r, x < lineX ? CUTE.blue : CUTE.orange, { lineWidth: Math.max(2, r * 0.22) });
  }

  // 경계선 = 내 몸
  ctx.save();
  ctx.strokeStyle = hit ? CUTE.green : PARTY.gold;
  ctx.lineWidth = fluidPx(dims, 6, { min: 4, max: 9 });
  ctx.beginPath(); ctx.moveTo(lineX, y - r * 3.6); ctx.lineTo(lineX, y + r * 3.6); ctx.stroke();
  ctx.restore();
  const pr = fluidPx(dims, 21, { min: 15, max: 29 });
  drawSticker(ctx, lineX, y - r * 4.8, pr * 0.85, hit ? CUTE.green : CUTE.cream, { lineWidth: Math.max(3, pr * 0.14) });
  drawChunkyText(ctx, "🧍", lineX, y - r * 4.8, pr, CUTE.ink, { outline: "#fff", outlineWidth: 2 });

  // 양쪽 개수 — 목표는 알려 주지 않는다. 지금 몇 개인지만 보여 준다.
  const fs = fluidPx(dims, 28, { min: 20, max: 38 });
  const ly = y + r * 5.4;
  drawStickerRect(ctx, w * 0.26, ly, fs * 4.2, fs * 1.8, fs * 0.45,
    hit ? CUTE.green : CUTE.blue, { lineWidth: Math.max(3, fs * 0.13), drop: fs * 0.15 });
  drawChunkyText(ctx, `${left}개`, w * 0.26, ly, fs, "#fff",
    { outline: CUTE.ink, outlineWidth: Math.max(3, fs * 0.18) });
  drawStickerRect(ctx, w * 0.74, ly, fs * 4.2, fs * 1.8, fs * 0.45,
    hit ? CUTE.green : CUTE.orange, { lineWidth: Math.max(3, fs * 0.13), drop: fs * 0.15 });
  drawChunkyText(ctx, `${round.total - left}개`, w * 0.74, ly, fs, "#fff",
    { outline: CUTE.ink, outlineWidth: Math.max(3, fs * 0.18) });

  // 맞는 자리에 서 있는 동안 차오르는 막대
  if (hit && holdMs > 0) {
    const bw = fs * 5.0, bh = fluidPx(dims, 10, { min: 7, max: 15 });
    const by = y - r * 6.8;
    drawStickerRect(ctx, lineX, by, bw, bh, bh / 2, "rgba(255,255,255,0.85)", { lineWidth: 2, drop: 0 });
    ctx.save();
    ctx.fillStyle = PARTY.gold;
    ctx.beginPath();
    ctx.roundRect(lineX - bw / 2, by - bh / 2, Math.max(bh, bw * (holdMs / HOLD_MS)), bh, bh / 2);
    ctx.fill();
    ctx.restore();
  }

  // 성공 직후에만 식을 보여 준다
  if (now < okFlash) {
    const efs = fluidPx(dims, 20, { min: 15, max: 27 });
    drawChunkyText(ctx, `✓ ${round.show}`, w * 0.5, h * 0.40, efs, PARTY.gold,
      { outline: CUTE.ink, outlineWidth: Math.max(3, efs * 0.22) });
  }
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = poseTracker.detect(video, tsMs);
    motion.push(tsMs, posePoints(result), w, h, video);
    if (state === "raise") {
      if (startGate.update(tsMs, isArmRaised(posePoints(result)))) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  if (mode === "motion" && state === "playing" && !motion.last) {
    drawChunkyText(ctx, "카메라에 온몸이 보이게 2~3걸음 물러서 주세요!", w * 0.5, h * 0.3,
      fluidPx(dims, 20, { min: 15, max: 27 }), "#fff",
      { outline: CUTE.ink, outlineWidth: fluidPx(dims, 6, { min: 4, max: 8 }) });
  }
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  const dt = lastFrameAt ? Math.min(0.05, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();

  if (!resolving) {
    readBody(dt);
    // 맞는 자리에 잠깐 서 있으면 성공. 지나치며 스치는 것과 구분하려면 이만큼은 필요하다.
    if (leftCount(lineX) === round.left) {
      holdMs += dt * 1000;
      if (holdMs >= HOLD_MS) succeed();
    } else {
      holdMs = Math.max(0, holdMs - dt * 1500);
    }
  }

  drawRope(ctx, now);

  // 이 문제에 남은 시간 띠
  if (!resolving) {
    const t = Math.max(0, 1 - (now - roundAt) / round.ms);
    const bw = w * 0.44, bh = fluidPx(dims, 9, { min: 6, max: 13 });
    const by = h * 0.32;
    drawStickerRect(ctx, w * 0.5, by, bw, bh, bh / 2, "rgba(255,255,255,0.8)", { lineWidth: 2, drop: 0 });
    ctx.save();
    ctx.fillStyle = t < 0.3 ? CUTE.red : PARTY.gold;
    ctx.beginPath();
    ctx.roundRect(w * 0.5 - bw / 2, by - bh / 2, Math.max(bh, bw * t), bh, bh / 2);
    ctx.fill();
    ctx.restore();
    if (t <= 0) timeUp();
  }

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "개" });
  drawCuteBanner(ctx, dims, [
    { text: round.text, size: 25, chunky: true, color: PARTY.gold },
    { text: round.hint, size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  if (remain < 10000) {
    const fs = fluidPx(dims, 22, { min: 16, max: 30 });
    const puls = 1 + Math.sin(now / 120) * 0.08;
    ctx.save();
    ctx.translate(w * 0.5, h * 0.87); ctx.scale(puls, puls);
    drawChunkyText(ctx, "🔥 라스트 스퍼트! 코인 2배", 0, 0, fs, CUTE.red,
      { outline: "#fff", outlineWidth: Math.max(4, fs * 0.24) });
    ctx.restore();
  }
  drawChunkyText(ctx,
    mode === "motion" ? "좌우로 걸어가 줄을 나눠요! 내 몸이 경계선이에요"
      : "좌우로 움직여 줄을 나눠요! 커서가 경계선이에요",
    w * 0.5, h * 0.965, fluidPx(dims, 14, { min: 11, max: 19 }), "#fff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  drawStreak(ctx);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);
  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
