function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------------------------------------------------------------------------
// 쌓기나무 — 3 x 3 바닥 위에 층수(0~3)를 적어 둔 표 하나로 입체 전체를 나타낸다.
// 위/앞/옆에서 본 모양은 모두 이 표에서 계산해 내므로 항상 서로 어긋나지 않는다.
// ---------------------------------------------------------------------------
const N = 3, MAXH = 3;

function makeSolid(maxH = MAXH, minTotal = 6, maxTotal = 15) {
  // 너무 납작하거나 꽉 찬 모양은 세 방향이 다 똑같아 보여 문제가 되지 않는다.
  // 낮은 단계에서는 층도 낮고 개수도 적게 만들어, 한눈에 세어지는 크기로 둔다.
  for (let tries = 0; tries < 200; tries++) {
    const g = [];
    for (let r = 0; r < N; r++) {
      g.push([]);
      for (let c = 0; c < N; c++) g[r].push(randInt(0, maxH));
    }
    const total = g.flat().reduce((a, b) => a + b, 0);
    if (total < minTotal || total > maxTotal) continue;
    const f = frontView(g), sv = sideView(g), t = topView(g);
    if (same(f, sv) || same(f, t) || same(sv, t)) continue;   // 세 방향이 서로 달라야 문제가 된다
    return g;
  }
  return [[1, 2, 0], [0, 3, 1], [2, 1, 0]];
}

function same(a, b) { return a.every((row, i) => row.every((v, j) => v === b[i][j])); }

// ⭐1 전용 — 모두 1층인 평면 배치.
// 시점을 돌릴 수 없게 됐으므로, 입체 그림 한 장만 보고도 답을 알 수 있어야 한다.
// 층이 2층 이상 섞이면 앞줄이 뒷줄을 완전히 가려 <그림만으로는 답이 정해지지 않는>
// 경우가 생긴다(3x3 사입체 투영에서 실제로 발생한다). 1층뿐이면 모든 칸이 보인다.
function makeFlat(minCells = 4, maxCells = 6) {
  for (let t = 0; t < 300; t++) {
    const g = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    let placed = 0;
    const n = randInt(minCells, maxCells);
    while (placed < n) { const r = randInt(0, 2), c = randInt(0, 2); if (!g[r][c]) { g[r][c] = 1; placed++; } }
    const rowsUsed = g.filter((row) => row.some((v) => v)).length;
    const colsUsed = [0, 1, 2].filter((c) => g.some((row) => row[c])).length;
    if (rowsUsed < 2 || colsUsed < 2) continue;   // 한 줄짜리는 문제가 되지 않는다
    return g;
  }
  return [[1, 1, 0], [0, 1, 0], [0, 1, 1]];
}

// 앞에서 보면 각 열(column)의 가장 높은 층수만큼 보인다.
// 결과는 [층][열] 순서의 3x3 참/거짓 표 — 맨 윗줄이 3층이다.
function frontView(g) {
  const out = [];
  for (let lv = MAXH - 1; lv >= 0; lv--) {
    const row = [];
    for (let c = 0; c < N; c++) {
      let m = 0;
      for (let r = 0; r < N; r++) m = Math.max(m, g[r][c]);
      row.push(m > lv ? 1 : 0);
    }
    out.push(row);
  }
  return out;
}

// 옆에서 본 모양 — 화면에서는 입체를 90도 돌려서 보여주므로,
// 정답도 반드시 "돌린 입체를 앞에서 본 모양"으로 정의해야 한다.
// 행별 최댓값을 따로 계산하면 좌우가 뒤집혀 그림과 어긋난다.
function sideView(g) { return frontView(rotate90(g)); }

// 위에서 보면 층이 하나라도 있는 자리가 보인다
function topView(g) { return g.map((row) => row.map((v) => (v > 0 ? 1 : 0))); }

function cubeCount(g) { return g.flat().reduce((a, b) => a + b, 0); }

// 표 하나를 살짝 망가뜨려 그럴듯한 오답을 만든다
function perturb(view) {
  const v = view.map((r) => r.slice());
  for (let t = 0; t < 30; t++) {
    const r = randInt(0, v.length - 1), c = randInt(0, v[0].length - 1);
    const flipped = v.map((row) => row.slice());
    flipped[r][c] = typeof v[r][c] === "number" && v[r][c] > 1 ? v[r][c] - 1 : (v[r][c] ? 0 : 1);
    if (!same(flipped, view)) return flipped;
  }
  return v;
}


// 보기 3장은 반드시 서로 달라야 한다.
// perturb()가 우연히 다른 보기와 똑같은 표를 만들어 내면, 아이가 <맞는 그림을 고르고도>
// 그게 오답 카드라서 틀리는 일이 생긴다. 그래서 중복을 걸러 가며 3장을 채운다.
function distinctOptions(ans, pool, more) {
  const keys = new Set([JSON.stringify(ans)]);
  const out = [{ v: ans, ok: true }];
  const push = (v) => {
    const k = JSON.stringify(v);
    if (keys.has(k)) return;
    keys.add(k);
    out.push({ v, ok: false });
  };
  for (const c of pool) { if (out.length >= 3) break; push(c); }
  for (let i = 0; i < 80 && out.length < 3; i++) push(more());
  return shuffle(out);
}

// ---------------------------------------------------------------------------
// 문제 — 시점 회전은 없앴다.
//
// 예전에는 손을 휘둘러 「앞 → 옆 → 위」로 돌려 볼 수 있었는데, 「위에서 본 모양은?」을
// 물어 놓고 위에서 본 모습으로 돌릴 수 있게 해 둔 셈이라 <돌리면 정답이 그대로 보였다>.
// 그래서 회전을 통째로 들어내고, 대신 <주어진 그림 한 장을 보고 머릿속으로 바꿔 보는>
// 원래의 학습으로 되돌렸다. 몸은 "정답 표적에 공을 던져 맞히는" 쪽에서 쓴다.
// ---------------------------------------------------------------------------

function genRound(level) {
  if (level === 1) {
    // ⭐1 — 1층짜리 평면 배치를 입체 그림으로 보여 주고 「위에서 본 모양」을 묻는다.
    const g = makeFlat(4, 6);
    const ans = topView(g);
    return {
      g, given: "solid", kind: "shape",
      ask: "「위에서 본 모양」은 어느 것일까요?",
      hint: "블록이 놓인 <자리>만 보면 돼요",
      options: distinctOptions(ans, [], () => perturb(ans)),
    };
  }
  if (level === 2) {
    // ⭐2 — 위에서 본 모양에 층수를 적은 표를 주고 개수를 묻는다(교과서와 같은 형태).
    // 입체 그림으로 주면 뒤에 숨은 나무가 보이지 않아 <그림만으로는 셀 수 없다>.
    const g = makeSolid(3, 6, 11);
    const n = cubeCount(g);
    const wrongs = new Set();
    for (let i = 0; i < 80 && wrongs.size < 2; i++) {
      const d = randInt(1, 3) * (Math.random() < 0.5 ? -1 : 1);
      if (n + d > 0) wrongs.add(n + d);
    }
    return {
      g, given: "table", kind: "count",
      ask: "쌓기나무는 모두 몇 개일까요?",
      hint: "칸에 적힌 층수를 모두 더해요",
      options: distinctOptions(n, [...wrongs], () => n + randInt(1, 4) * (Math.random() < 0.5 ? -1 : 1)),
    };
  }
  // ⭐3 — 층수 표를 주고 앞/옆에서 본 모양을 묻는다
  const g = makeSolid(3, 6, 13);
  const front = Math.random() < 0.5;
  const ans = front ? frontView(g) : sideView(g);
  const other = front ? sideView(g) : frontView(g);
  return {
    g, given: "table", kind: "shape",
    ask: `「${front ? "앞" : "옆"}에서 본 모양」은 어느 것일까요?`,
    hint: front ? "세로줄마다 가장 높은 층수만큼 보여요" : "가로줄마다 가장 높은 층수만큼 보여요",
    options: distinctOptions(ans, [other, topView(g)], () => perturb(ans)),
  };
}

let autoDiff, count, playEndAt;
let round = null, roundAt, resolving;
let cards = [], judgedIdx = -1, judgedOk = false;
let ball = null;            // 날아가는 공 {x,y,vx,vy,g}
let aimX = 0;               // 지금 겨누고 있는 착지점
let lastThrowAt = 0;
let throws = 0;             // 이 문제에서 던진 횟수 (한 번에 맞히면 퍼펙트)
let confetti = [], sparks = [];
const shake = new ScreenShake();

let cursors = [];
let lastFrameAt = 0;

// ── 도움 표시 ── 두 번 연속 틀리면 다음 문제의 정답을 반짝여 알려 준다.
// 계속 틀리기만 하면 아이는 포기한다. "한 번은 맞혀 보는 경험"이 있어야 다음을 시도한다.
let missStreak = 0;
function helpOn() { return missStreak >= 2; }
function drawHelpRing(ctx, x, y, r) {
  if (!helpOn()) return;
  const t = (performance.now() % 800) / 800;
  ctx.save();
  ctx.globalAlpha = 0.9 * (1 - t * 0.5);
  ctx.strokeStyle = PARTY.gold;
  ctx.lineWidth = Math.max(4, r * 0.22);
  ctx.beginPath();
  ctx.arc(x, y, r * (1.15 + t * 0.35), 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

const ROUND_MS = 14000;      // 이 안에 못 맞히면 다음 문제 — 여러 번 던져 볼 시간을 준다
const NEXT_MS = 600;

// 던지기 — 손을 <위로 확 뿌리는> 동작에서만 발동한다.
// 좌우로 움직이는 건 조준이므로, 가로 움직임을 던지기로 읽으면 겨누다가 제멋대로 날아간다.
const THROW_SPEED = 1.25;    // 어깨 너비/초
const THROW_COOL = 620;
// 세로 배치 — 위에서부터 HUD · 문제 배너 · 시간 띠 · 카드 띠 · 입체 · 발사대.
// 처음엔 카드를 0.24 에 뒀다가 문제 배너와 겹쳤다. 배너는 HUD 아래 0.25h 까지 내려온다.
const BAND_Y = 0.41;         // 카드가 지나가는 높이
const BAR_Y = 0.55;          // 남은 시간 띠 (카드 띠와 입체 사이의 빈 곳)
const SOLID_BASE = 0.80;     // 입체가 서 있는 바닥
const LAUNCH_Y = 0.90;       // 공이 출발하는 높이

function launcher() { return { x: dims.w * 0.5, y: dims.h * LAUNCH_Y }; }

// 공이 카드 띠에 닿기까지 걸리는 시간(초). 세게 뿌릴수록 빨리 도착해 덜 겨눠도 된다.
function flightT(swingSpeed) {
  const t = 0.86 - Math.max(0, swingSpeed - THROW_SPEED) * 0.14;
  return Math.max(0.42, Math.min(0.86, t));
}

// 출발점에서 목표점까지 T초에 도착하는 포물선. 중력을 T에 맞춰 정하지 않으면
// T가 커질수록 최고점이 화면 밖으로 솟는다(6학년판에서 한 번 겪은 함정).
function launch(x, y, tx, ty, T) {
  const g = (dims.h * 2.6) / (T * T);
  return { x, y, vx: (tx - x) / T, vy: (ty - y - 0.5 * g * T * T) / T, g };
}

function layoutCards() {
  const { w, h } = dims;
  const n = round.options.length;
  const cw = Math.min(w * 0.22, h * 0.19);
  const gap = (w - cw * n) / (n + 1);
  // ⭐이 오를수록 카드가 빨리 흘러간다 — 그만큼 앞을 더 겨눠야 한다.
  // 셋이 <같은 방향으로> 흘러가야 한다. 서로 반대로 보내면 금세 겹쳐서
  // 두 장이 한자리에 포개지고, 어느 카드를 맞혔는지 알 수 없게 된다.
  const dir = Math.random() < 0.5 ? 1 : -1;
  const sp = w * (autoDiff.level === 1 ? 0.045 : autoDiff.level === 2 ? 0.085 : 0.125) * dir;
  cards = round.options.map((o, i) => ({
    ...o,
    x: gap * (i + 1) + cw * (i + 0.5),
    y: h * BAND_Y,
    w: cw, h: cw * 0.92,
    vx: sp,
  }));
}

function newRound() {
  round = genRound(autoDiff.level);
  layoutCards();
  judgedIdx = -1; judgedOk = false;
  ball = null; throws = 0;
  aimX = dims.w * 0.5;
  resolving = false;
  motion.reset();
  roundAt = performance.now();
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function throwBall(swingSpeed) {
  const now = performance.now();
  if (now - lastThrowAt < THROW_COOL || ball || resolving) return;
  lastThrowAt = now;
  throws++;
  const L = launcher();
  ball = { ...launch(L.x, L.y, aimX, dims.h * BAND_Y, flightT(swingSpeed)), trail: [] };
  if (!isMuted()) sound.swoosh();
}

function choose(i) {
  resolving = true;
  judgedIdx = i;
  const c = cards[i];
  judgedOk = c.ok;
  if (c.ok) {
    count++;
    const spurt = playEndAt - performance.now() < 10000;
    // 한 번에 맞히면 퍼펙트 — 여러 번 던져 맞혀도 정답은 정답이다
    const perfect = throws <= 1;
    party.correct(c.x, c.y, { base: (perfect ? 15 : 11) * (spurt ? 2 : 1), elapsedMs: performance.now() - roundAt });
    if (perfect) party.judge(c.x, c.y - c.h * 0.8, "✨ 원샷 명중!", PARTY.gold);
    if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
    autoDiff.reportCorrect();
    missStreak = 0;
    autoRec.trigger();
    shake.trigger(9, 220);
    if (!isMuted()) sound.hit("perfect");
    spawnSparkles(sparks, c.x, c.y, 30, ["#fff", PARTY.gold, CUTE.green]);
    if (party.combo > 0 && party.combo % 5 === 0) {
      spawnConfetti(confetti, c.x, c.y - 60, 44);
      if (!isMuted()) sound.fever();
    }
  } else {
    party.wrong(c.x, c.y, "다시 살펴봐요!");
    autoDiff.reportWrong();
    missStreak++;
    shake.trigger(6, 170);
    if (!isMuted()) sound.wrong();
  }
  setTimeout(() => { if (state === "playing") newRound(); }, NEXT_MS);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });

  document.getElementById("statCount").textContent = count + "개";
  document.getElementById("statBest").textContent = best + "개";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽6_쌓기나무던지기_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽6_쌓기나무던지기_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});

document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

// ── 쌓기나무 그리기 ──
//
// 45도 아이소메트릭으로 그리면 화면에 보이는 실루엣이 교과서의 "앞에서 본 모양"
// (= 각 열의 가장 높은 층수)과 어긋난다. 아이소메트릭에서는 가로 위치가 열(c)이 아니라
// (c - r)로 정해지기 때문이다. 그래서 여기서는 <사입체(캐비닛) 투영>을 쓴다 —
// 앞면은 정면 그대로 두고 안쪽(행 r)만 오른쪽 위로 밀어 낸다.
// 그러면 화면에 보이는 앞모습 실루엣이 frontView()의 결과와 정확히 같아진다.
function drawCube(ctx, x, y, cw, ch, dx, dy, shade) {
  // 윗면 (안쪽으로 밀린 평행사변형)
  ctx.beginPath();
  ctx.moveTo(x, y - ch);
  ctx.lineTo(x + dx, y - ch + dy);
  ctx.lineTo(x + cw + dx, y - ch + dy);
  ctx.lineTo(x + cw, y - ch);
  ctx.closePath();
  ctx.fillStyle = shade.top; ctx.fill(); ctx.stroke();
  // 오른쪽 옆면
  ctx.beginPath();
  ctx.moveTo(x + cw, y - ch);
  ctx.lineTo(x + cw + dx, y - ch + dy);
  ctx.lineTo(x + cw + dx, y + dy);
  ctx.lineTo(x + cw, y);
  ctx.closePath();
  ctx.fillStyle = shade.right; ctx.fill(); ctx.stroke();
  // 앞면 — 이 면들이 모여 "앞에서 본 모양"이 된다
  ctx.beginPath();
  ctx.rect(x, y - ch, cw, ch);
  ctx.fillStyle = shade.front; ctx.fill(); ctx.stroke();
}

function drawSolid(ctx, g, cx, cy, unit) {
  const cw = unit * 1.5, ch = unit * 1.5;
  const dx = unit * 0.62, dy = -unit * 0.45;
  const shade = { front: "#3bc9db", top: "#a5e8f0", right: "#0b9aad" };
  const x0 = cx - (N * cw) / 2 - ((N - 1) * dx) / 2;
  const y0 = cy + ((N - 1) * -dy) / 2;
  ctx.save();
  ctx.strokeStyle = CUTE.ink;
  ctx.lineWidth = Math.max(2, unit * 0.11);
  ctx.lineJoin = "round";
  // 뒤쪽 행(r이 큰 쪽)부터 그려야 앞줄이 뒷줄을 가린다
  for (let r = N - 1; r >= 0; r--) {
    for (let k = 0; k < MAXH; k++) {
      for (let c = 0; c < N; c++) {
        if (g[r][c] <= k) continue;
        const x = x0 + c * cw + r * dx;
        const y = y0 - k * ch + r * dy;
        drawCube(ctx, x, y, cw, ch, dx, dy, shade);
      }
    }
  }
  ctx.restore();
}

// ── 위에서 본 모습 (바둑판) ──
function drawTopDown(ctx, g, cx, cy, cell, withNumbers) {
  const x0 = cx - (cell * N) / 2, y0 = cy - (cell * N) / 2;
  ctx.save();
  ctx.strokeStyle = CUTE.ink;
  ctx.lineWidth = Math.max(2, cell * 0.07);
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const filled = g[r][c] > 0;
      ctx.fillStyle = filled ? "#3bc9db" : "rgba(255,255,255,0.35)";
      ctx.beginPath();
      ctx.roundRect(x0 + c * cell + cell * 0.06, y0 + r * cell + cell * 0.06, cell * 0.88, cell * 0.88, cell * 0.16);
      ctx.fill(); ctx.stroke();
      if (withNumbers && filled) {
        drawChunkyText(ctx, String(g[r][c]), x0 + c * cell + cell * 0.5, y0 + r * cell + cell * 0.5,
          cell * 0.44, "#fff", { outline: CUTE.ink, outlineWidth: Math.max(2, cell * 0.09) });
      }
    }
  }
  ctx.restore();
}

// ── 3x3 표 하나 (보기 카드 안에 들어간다) ──
function drawGrid(ctx, v, cx, cy, cell, numbers) {
  const rows = v.length, cols = v[0].length;
  const x0 = cx - (cell * cols) / 2, y0 = cy - (cell * rows) / 2;
  ctx.save();
  ctx.strokeStyle = CUTE.ink;
  ctx.lineWidth = Math.max(1.6, cell * 0.08);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const val = v[r][c];
      const filled = val > 0;
      ctx.fillStyle = filled ? CUTE.green : "rgba(255,255,255,0.5)";
      ctx.beginPath();
      ctx.roundRect(x0 + c * cell + cell * 0.07, y0 + r * cell + cell * 0.07, cell * 0.86, cell * 0.86, cell * 0.18);
      ctx.fill(); ctx.stroke();
      if (numbers && filled) {
        drawChunkyText(ctx, String(val), x0 + c * cell + cell * 0.5, y0 + r * cell + cell * 0.5,
          cell * 0.46, "#fff", { outline: CUTE.ink, outlineWidth: Math.max(1.6, cell * 0.1) });
      }
    }
  }
  ctx.restore();
}

// ── 보기 카드 ──
function drawCards(ctx) {
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    const judged = i === judgedIdx;
    const fill = judged ? (judgedOk ? CUTE.green : CUTE.red) : CUTE.cream;
    drawStickerRect(ctx, c.x, c.y, c.w, c.h, c.w * 0.14, fill,
      { lineWidth: Math.max(3, c.w * 0.045), drop: c.w * 0.05 });
    if (round.kind === "count") {
      drawChunkyText(ctx, `${c.v}개`, c.x, c.y, c.h * 0.42, judged ? "#fff" : CUTE.ink,
        { outline: judged ? CUTE.ink : "#fff", outlineWidth: Math.max(3, c.h * 0.09) });
    } else {
      drawGrid(ctx, c.v, c.x, c.y, Math.min(c.w, c.h) * 0.27, false);
    }
    // 두 번 연속 틀렸으면 정답 카드를 반짝여 알려 준다
    if (helpOn() && c.ok && !resolving) {
      const t = (performance.now() % 800) / 800;
      ctx.save();
      ctx.globalAlpha = 0.9 * (1 - t * 0.5);
      ctx.strokeStyle = PARTY.gold;
      ctx.lineWidth = Math.max(5, c.w * 0.07);
      const g = 6 + t * 10;
      ctx.strokeRect(c.x - c.w / 2 - g, c.y - c.h / 2 - g, c.w + g * 2, c.h + g * 2);
      ctx.restore();
    }
  }
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = poseTracker.detect(video, tsMs);
    motion.push(tsMs, posePoints(result), w, h, video);
    if (state === "raise") {
      if (startGate.update(tsMs, isArmRaised(posePoints(result)))) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  if (mode === "motion") {
    const f = motion.last;
    if (f) {
      const r = fluidPx(dims, 24, { min: 17, max: 34 });
      // 고르는 손(더 높이 든 손)은 크게, 나머지는 작게 — 어느 손이 커서인지 헷갈리지 않게
      const pickHand = f.lw.y < f.rw.y ? "lw" : "rw";
      for (const k of ["lw", "rw"]) {
        drawSticker(ctx, f[k].x, f[k].y, k === pickHand ? r : r * 0.66,
          k === pickHand ? PARTY.gold : "rgba(255,255,255,0.7)",
          { lineWidth: Math.max(3, r * 0.15) });
      }
    } else if (state === "playing") {
      drawChunkyText(ctx, "카메라에 몸이 보이게 물러서 주세요!", w * 0.5, h * 0.5,
        fluidPx(dims, 22, { min: 16, max: 30 }), "#fff",
        { outline: CUTE.ink, outlineWidth: fluidPx(dims, 6, { min: 4, max: 8 }) });
    }
  } else {
    for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 44, { min: 32, max: 62 }), { active: !resolving });
  }
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();
  const bandY = h * BAND_Y;
  const L = launcher();

  // ── 카드는 좌우로 흘러간다 (움직이는 표적) ──
  // 화면 끝으로 나가면 반대편에서 다시 들어온다 (간격이 그대로 유지된다)
  for (const c of cards) {
    c.x += c.vx * dt;
    if (c.x < -c.w * 0.7) c.x = w + c.w * 0.7;
    if (c.x > w + c.w * 0.7) c.x = -c.w * 0.7;
  }

  // ── 조준 ──
  // 모션: 손을 좌우로 움직인 <위치>가 곧 착지점이다. 팔 각도로 조준하게 하면
  //       6학년이 각도를 미세 조정하다 시간을 다 쓴다. 위치는 눈으로 바로 확인된다.
  if (!resolving) {
    if (mode === "motion") {
      const f = motion.last;
      if (f) {
        const hand = f.lw.y < f.rw.y ? f.lw : f.rw;      // 더 높이 든 손이 던지는 손
        aimX += (hand.x - aimX) * Math.min(1, dt * 12);   // 손떨림을 걸러 준다
      }
    } else if (cursors[0]) {
      aimX = cursors[0].x;
    }
    aimX = Math.max(w * 0.04, Math.min(w * 0.96, aimX));
  }

  // ── 던지기 ──
  if (!resolving && !ball) {
    if (mode === "motion") {
      const sw = motion.swing();
      // 위로 뿌리는 동작만 던지기다. 가로 움직임은 조준이므로 반드시 구분해야 한다.
      if (sw && sw.speed > THROW_SPEED && sw.dy < 0 && Math.abs(sw.dy) > Math.abs(sw.dx) * 0.7) {
        throwBall(sw.speed);
      }
    } else if (pointerInput && pointerInput.consumeJustDown()) {
      // 누른 지점을 겨눈 것으로 보고 바로 던진다 (한 프레임짜리 클릭도 놓치지 않는다)
      if (cursors[0]) aimX = Math.max(w * 0.04, Math.min(w * 0.96, cursors[0].x));
      throwBall(THROW_SPEED);
    }
  }

  // ── 공 ──
  if (ball) {
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 12) ball.trail.shift();
    ball.vy += ball.g * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    let hit = -1;
    // 내려오는 중일 때만 맞는다. 공은 카드 띠 위로 한 번 솟았다가 떨어지므로,
    // 올라가는 길에 스치는 것까지 세면 <아직 겨냥한 자리에 닿기도 전에> 판정돼 버린다.
    if (ball.vy >= 0) {
      for (let i = 0; i < cards.length; i++) {
        const c = cards[i];
        if (Math.abs(ball.x - c.x) <= c.w / 2 && Math.abs(ball.y - c.y) <= c.h / 2) { hit = i; break; }
      }
    }
    if (hit >= 0) { ball = null; choose(hit); }
    else if (ball.y < -h * 0.2 || ball.x < -w * 0.2 || ball.x > w * 1.2) {
      // 빗나갔다 — 벌점 없이 다시 던지게 한다. 계산은 맞았는데 던지기가 서툴러
      // 점수를 잃으면 아이는 수학이 아니라 조작을 원망하게 된다.
      ball = null;
      party.judge(w * 0.5, h * 0.62, "빗나갔어요! 다시!", CUTE.blue);
      if (!isMuted()) sound.fizzle();
    }
  }

  // 시간 안에 못 맞히면 놓침
  if (!resolving && now - roundAt > ROUND_MS) {
    resolving = true;
    party.wrong(w * 0.5, h * 0.5, "시간 초과!");
    autoDiff.reportWrong();
    missStreak++;
    if (!isMuted()) sound.wrong();
    setTimeout(() => { if (state === "playing") newRound(); }, NEXT_MS);
  }

  // ── 문제 (입체 그림 또는 층수 표) ──
  const cx = w * 0.5;
  const unit = Math.min(w * 0.050, h * 0.040);
  if (round.given === "solid") drawSolid(ctx, round.g, cx, h * SOLID_BASE, unit);
  else drawTopDown(ctx, round.g, cx, h * (SOLID_BASE - 0.11), unit * 1.5, true);

  const vfs = fluidPx(dims, 15, { min: 11, max: 20 });
  const badge = round.given === "solid" ? "🧊 쌓기나무" : "🔢 위에서 본 모양에 층수를 쓴 것";
  const by = h * (SOLID_BASE + 0.045);
  drawStickerRect(ctx, cx, by, vfs * (round.given === "solid" ? 8 : 17), vfs * 1.8, vfs * 0.5,
    PARTY.gold, { lineWidth: Math.max(3, vfs * 0.16), drop: vfs * 0.2 });
  drawChunkyText(ctx, badge, cx, by, vfs, CUTE.ink,
    { outline: "#fff", outlineWidth: Math.max(2.5, vfs * 0.16) });

  // ── 조준선 · 던지는 사람 ──
  if (!resolving) {
    drawAim(ctx, L, aimX, bandY);
    const pr = fluidPx(dims, 22, { min: 16, max: 30 });
    drawSticker(ctx, L.x, L.y, pr, CUTE.cream, { lineWidth: Math.max(3, pr * 0.16) });
    drawChunkyText(ctx, ball ? "💨" : "🤾", L.x, L.y, pr * 1.1, CUTE.ink, { outline: "#fff", outlineWidth: 2 });
  }

  // ── 공 ──
  if (ball) {
    for (let i = 0; i < ball.trail.length; i++) {
      const t = ball.trail[i], a = (i + 1) / ball.trail.length;
      ctx.save(); ctx.globalAlpha = a * 0.45; ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(t.x, t.y, fluidPx(dims, 7, { min: 5, max: 10 }) * a, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    drawSticker(ctx, ball.x, ball.y, fluidPx(dims, 15, { min: 11, max: 21 }), CUTE.orange,
      { lineWidth: fluidPx(dims, 3.5, { min: 2.5, max: 5 }) });
  }

  // 이 문제에 남은 시간 띠
  if (!resolving) {
    const t = Math.max(0, 1 - (now - roundAt) / ROUND_MS);
    const bw = w * 0.5, bh = fluidPx(dims, 9, { min: 6, max: 13 });
    const bx = w * 0.5, by = h * BAR_Y;
    drawStickerRect(ctx, bx, by, bw, bh, bh / 2, "rgba(255,255,255,0.8)", { lineWidth: 2, drop: 0 });
    ctx.save();
    ctx.fillStyle = t < 0.3 ? CUTE.red : PARTY.gold;
    ctx.beginPath();
    ctx.roundRect(bx - bw / 2, by - bh / 2, Math.max(bh, bw * t), bh, bh / 2);
    ctx.fill();
    ctx.restore();
  }

  drawCards(ctx);


  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "개" });

  drawCuteBanner(ctx, dims, [
    { text: round.ask, size: 23, chunky: true, color: PARTY.gold },
    { text: round.hint, size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });

  if (remain < 10000) {
    const fs2 = fluidPx(dims, 22, { min: 16, max: 30 });
    const puls = 1 + Math.sin(now / 120) * 0.08;
    ctx.save(); ctx.translate(w * 0.5, h * 0.55); ctx.scale(puls, puls);
    drawChunkyText(ctx, "🔥 라스트 스퍼트! 코인 2배", 0, 0, fs2, CUTE.red,
      { outline: "#fff", outlineWidth: Math.max(4, fs2 * 0.24) });
    ctx.restore();
  }
  drawChunkyText(ctx,
    mode === "motion" ? "손을 좌우로 움직여 겨누고 · 위로 확 뿌려서 던지기!" : "맞히고 싶은 곳을 누르면 던져요!",
    w * 0.5, h * 0.985, fluidPx(dims, 15, { min: 11, max: 20 }), "#fff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);

  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

// 지금 던지면 어디로 가는지 점선으로 그려 준다.
// 움직이는 표적을 맞히려면 "얼마나 앞을 겨눠야 하는지" 눈으로 보여야 한다.
function drawAim(ctx, L, tx, ty) {
  const T = flightT(THROW_SPEED);
  const b = launch(L.x, L.y, tx, ty, T);
  ctx.save();
  ctx.globalAlpha = ball ? 0.25 : 0.9;
  // 하늘색 배경에 흰 점을 찍으면 보이지 않는다 — 금색 점에 남색 테두리를 두른다
  ctx.fillStyle = PARTY.gold;
  ctx.strokeStyle = CUTE.ink;
  for (let i = 1; i <= 14; i++) {
    const t = (T * i) / 14;
    const x = b.x + b.vx * t;
    const y = b.y + b.vy * t + 0.5 * b.g * t * t;
    const rr = fluidPx(dims, 5, { min: 3.5, max: 7 }) * (1 - i / 22);
    ctx.lineWidth = Math.max(1.5, rr * 0.4);
    ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
  // 착지점 표시
  const mr = fluidPx(dims, 16, { min: 12, max: 22 });
  ctx.save();
  ctx.globalAlpha = ball ? 0.3 : 1;
  ctx.strokeStyle = PARTY.gold;
  ctx.lineWidth = Math.max(3, mr * 0.24);
  ctx.beginPath(); ctx.arc(tx, ty, mr, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tx - mr * 1.5, ty); ctx.lineTo(tx + mr * 1.5, ty); ctx.stroke();
  ctx.restore();
}

// 바닥 표를 90° 돌린다 — "옆에서 본 모습"은 돌려 세운 같은 입체다
function rotate90(g) {
  const out = [];
  for (let r = 0; r < N; r++) {
    out.push([]);
    for (let c = 0; c < N; c++) out[r].push(g[N - 1 - c][r]);
  }
  return out;
}

init();
</script>
