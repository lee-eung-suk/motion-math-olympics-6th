<script type="module">
import {
  HighScore, requestWakeLock, SoundKit, FileAudioLoop,
  ClipRecorder, downloadBlob,
  drawMirroredVideo, fitCanvasToScreen, getCursors,
  PoseTracker, PoseMotion, posePoints, isArmRaised,

  ScreenShake, InputMode, PointerInput, StartGate,

} from "../js/engine.js?v=4";
import {

  PARTY, CHARACTERS, Party, drawPartyBackdrop, drawCrowd, drawMascot,
  showRuleCard, renderPodium, irisTransition,
} from "../js/party.js?v=2";
requestWakeLock();

const UNIT = "n2";
const TITLE = "소수점 클레이 사격";
const RECORD_SUFFIX = "발 명중";
const MEDALS = { bronze: 6, silver: 11, gold: 16 };
const CHAR = CHARACTERS[UNIT];
const mode = InputMode.get();

const video = document.getElementById("video");
const canvas = document.getElementById("gameCanvas");
let dims = fitCanvasToScreen(canvas);
let drifters = makeDrifters(8, dims.w, dims.h);
window.addEventListener("resize", () => {
  dims = fitCanvasToScreen(canvas);
  drifters = makeDrifters(8, dims.w, dims.h);
});

const sound = new SoundKit();
const bgm = new FileAudioLoop("../assets/sounds/subbgm.mp3", 0.32);
const isMuted = () => localStorage.getItem("smo_muted") === "1";
const party = new Party({ unit: UNIT, sound, isMuted });

function goHome() { bgm.stop(); irisTransition(() => { location.href = "../index.html"; }); }
document.getElementById("homeBtn").addEventListener("click", goHome);
document.getElementById("homeBtn2").addEventListener("click", goHome);

function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function clean(v) { return +v.toFixed(6); }
function fmt(v) { return String(clean(v)); }

// ---------------------------------------------------------------------------
// 문제 만들기
//
// 이 단원의 진짜 어려움은 나눗셈이 아니라 <소수점을 어디에 찍느냐>다.
// 그래서 접시 세 개는 전부 <숫자는 같고 소수점 자리만 다른> 값으로 만든다.
// 눈으로 고르는 길을 막아 두는 것이 이 종목의 핵심이다.
// ---------------------------------------------------------------------------
function genRound(level) {
  let a, b, ans, formula;
  // ⭐1·⭐2는 <소수 ÷ 자연수>라 나누어지는 수에 소수점이 반드시 있어야 한다.
  // 몫이 딱 떨어지면 "6 ÷ 3" 처럼 소수가 한 자리도 없는 문제가 나와 단원과 어긋난다.
  for (let tries = 0; tries < 200; tries++) {
    if (level === 1) {
      b = randInt(2, 5);
      const q = randInt(11, 49) / 10;        // 몫은 1.1 ~ 4.9
      a = clean(q * b);
      ans = clean(q);
      formula = "자연수처럼 나눈 뒤, 소수점을 그대로 내려 찍어요";
    } else if (level === 2) {
      b = randInt(2, 9);
      const q = randInt(1, 9) / 10;          // 몫이 1보다 작다
      a = clean(q * b);
      ans = clean(q);
      formula = "몫이 1보다 작으면 일의 자리에 0을 먼저 써요";
    } else {
      // (소수) ÷ (소수) — 나누는 수가 소수이므로 나누어지는 수는 자연수여도 된다
      const bd = [0.2, 0.4, 0.5, 0.8, 2.5][randInt(0, 4)];
      const q = randInt(2, 24) / 10;
      b = bd;
      a = clean(q * bd);
      ans = clean(q);
      formula = "나누는 수가 자연수가 되게 두 수에 똑같이 10을 곱해요";
    }
    if (level === 3) break;
    if (!Number.isInteger(a) && !Number.isInteger(ans)) break;
  }

  const wrongs = new Set();
  for (const f of [10, 0.1, 100, 0.01]) {
    const v = clean(ans * f);
    if (v !== ans && v > 0 && v < 10000 && String(v).length <= 7) wrongs.add(v);
    if (wrongs.size >= 2) break;
  }
  return {
    a, b, ans, formula,
    q: `${fmt(a)} ÷ ${fmt(b)} = ?`,
    options: shuffle([{ v: ans, ok: true }, ...[...wrongs].slice(0, 2).map((v) => ({ v, ok: false }))]),
  };
}

const poseTracker = new PoseTracker();
const motion = new PoseMotion();
let pointerInput = null;

async function init() {
  if (!isMuted()) bgm.play(showSoundHint);
  if (mode === "motion") {
    try {
      await startCamera(video, { width: 640, height: 480 });
      if (!isMuted()) bgm.play(showSoundHint);
    } catch (e) {
      document.getElementById("loadingText").textContent = "⚠️ 카메라를 찾을 수 없어요. 카메라 권한을 확인해주세요.";
      return;
    }
    document.getElementById("loadingText").textContent = "AI 모델을 불러오는 중…";
    await poseTracker.init();
  } else {
    pointerInput = new PointerInput(canvas);
  }
  document.getElementById("loadingPanel").style.display = "none";

  await showRuleCard({
    unit: UNIT,
    title: "소수점 클레이 사격",
    lines: [
      "접시 세 개가 <b>사방에서</b> 날아와요. 답이 적힌 접시를 쏘세요!",
      mode === "motion"
        ? "<b>두 손을 모으면</b> 총이 돼요. 손을 벌리면 안 나가요(안전장치)."
        : "<b>화면을 누르고 있으면</b> 발사돼요.",
      "조준경이 접시에 닿으면 <b>탕!</b> 하고 나가요.",
      "총알은 <b>세 발</b>! 엉뚱한 접시를 깨면 한 발 줄어요.",
    ],
  });

  document.getElementById("raiseIcon").textContent = mode === "motion" ? "🙋" : "👆";
  document.getElementById("raiseText").textContent = mode === "motion" ? "손을 들어 주세요!" : "화면을 터치(클릭)하면 시작!";
  document.getElementById("raisePanel").style.display = "flex";
  state = "raise";
  requestAnimationFrame(loop);
}

let state = "loading";
const holdFill = document.getElementById("holdFill");
const startGate = new StartGate(mode, holdFill);

let autoDiff, count, playEndAt;
let round = null, discs = [], roundAt, resolving = false;
let bursts = [];
let confetti = [], sparks = [];
const shake = new ScreenShake();
let recorder, comboShot, fallbackShot, autoRec, recordedBlob = null;
const recIndicator = document.getElementById("recIndicator");
let cursors = [];
let lastFrameAt = 0;

const NEXT_MS = 320;   // 다음 것이 거의 바로 온다 — 끊기면 리듬이 죽는다
const AMMO = 3;        // 한 문제에 세 발 — 아무 데나 쏘면 총알이 없다
let ammo = AMMO;

// ── 조준 ──
// 예전에는 손을 접시에 갖다 대면 명중이었다. 마우스 커서와 완전히 같은 동작이라
// 카메라를 켤 이유가 없었다. 이제 <두 손을 모아 총을 만들어야> 쏠 수 있다.
// 손을 벌리면 안전장치가 걸려 발사되지 않으므로, 총구 관리가 게임의 일부가 된다.
const AIM_JOIN = 0.85;      // 두 손 사이가 어깨 너비의 이 배 이내여야 "총을 모은 것"
const SHOT_COOL = 420;
let aim = { x: 0, y: 0 };
let armed = false;          // 지금 쏠 수 있는 상태인가
let lastShotAt = 0, recoil = 0;

// 연속 성공을 크게 알려 준다 — 잘하고 있다는 게 눈에 보여야 계속 몸을 쓴다
let streakMsg = null;
function noteStreak(n) {
  if (n >= 3) streakMsg = { text: n >= 10 ? `🔥 ${n}연속 대단해요!` : n >= 5 ? `⚡ ${n}연속!` : `${n}연속!`, until: performance.now() + 1000 };
}
function drawStreak(ctx) {
  if (!streakMsg || performance.now() > streakMsg.until) return;
  const { w, h } = dims;
  const fs = fluidPx(dims, 30, { min: 21, max: 42 });
  const puls = 1 + Math.sin(performance.now() / 110) * 0.09;
  ctx.save();
  ctx.translate(w * 0.5, h * 0.47); ctx.scale(puls, puls);
  drawChunkyText(ctx, streakMsg.text, 0, 0, fs, PARTY.gold,
    { outline: CUTE.ink, outlineWidth: Math.max(4, fs * 0.22) });
  ctx.restore();
}

// ── 도움 표시 ── 두 번 연속 틀리면 다음 문제의 정답을 반짝여 알려 준다.
// 계속 틀리기만 하면 아이는 포기한다. "한 번은 맞혀 보는 경험"이 있어야 다음을 시도한다.
let missStreak = 0;
function helpOn() { return missStreak >= 2; }
function drawHelpRing(ctx, x, y, r) {
  if (!helpOn()) return;
  const t = (performance.now() % 800) / 800;
  ctx.save();
  ctx.globalAlpha = 0.9 * (1 - t * 0.5);
  ctx.strokeStyle = PARTY.gold;
  ctx.lineWidth = Math.max(4, r * 0.22);
  ctx.beginPath();
  ctx.arc(x, y, r * (1.15 + t * 0.35), 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function isSpurt() { return playEndAt - performance.now() < 10000; }

// 콤보가 쌓일수록, 마지막 10초에는 접시가 빨리 떨어진다
function fallMs() {
  const base = level1() ? 5400 : autoDiff.level === 2 ? 4400 : 3600;
  const byCombo = Math.max(0.55, 1 - party.combo * 0.04);
  return base * byCombo * (isSpurt() ? 0.82 : 1);
}
function level1() { return autoDiff.level === 1; }

// ── 접시 궤도 ──
// 예전에는 세 접시가 전부 위에서 아래로 곧게 떨어졌다. 클레이 사격이라면
// 사방에서 날아와야 한다. 세 가지 궤도를 섞어 쓴다.
function makePath(kind) {
  const { w, h } = dims;
  const dir = Math.random() < 0.5 ? 1 : -1;
  if (kind === "arc") {
    // 아래 구석에서 비스듬히 솟아올라 반대쪽으로 떨어진다 — 진짜 클레이
    const x0 = dir > 0 ? -w * 0.08 : w * 1.08;
    const x1 = dir > 0 ? w * 1.08 : -w * 0.08;
    // 최고점을 0.15h 로 두면 접시가 HUD·깃발 뒤로 숨는다
    const y0 = h * 0.92, peak = h * (0.26 + Math.random() * 0.10);
    return (t) => ({ x: x0 + (x1 - x0) * t, y: y0 - (y0 - peak) * (4 * t * (1 - t)) });
  }
  if (kind === "cross") {
    // 옆에서 가로질러 간다 (살짝 기울여서)
    const x0 = dir > 0 ? -w * 0.08 : w * 1.08;
    const x1 = dir > 0 ? w * 1.08 : -w * 0.08;
    const y0 = h * (0.26 + Math.random() * 0.34);
    const y1 = y0 + h * (Math.random() * 0.22 - 0.11);
    return (t) => ({ x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t });
  }
  // 위에서 비스듬히 떨어진다
  const x0 = w * (0.18 + Math.random() * 0.64);
  const x1 = Math.max(w * 0.05, Math.min(w * 0.95, x0 + dir * w * 0.34));
  return (t) => ({ x: x0 + (x1 - x0) * t, y: -h * 0.06 + h * 1.02 * t });
}

function newRound() {
  round = genRound(autoDiff.level);
  const dur = fallMs();
  // 접시마다 조금씩 시차를 둬야 한 번에 세 개가 나란히 지나가지 않고 리듬이 생긴다
  const offs = shuffle([0, 0.12, 0.24]);
  const kinds = shuffle(["arc", "cross", "drop"]);
  discs = round.options.map((o, i) => ({
    ...o, x: 0, y: 0, r: 0, at: performance.now() + offs[i] * dur, dur,
    path: makePath(kinds[i]), hit: false, spin: Math.random() * 6.28,
  }));
  bursts = [];
  ammo = AMMO;
  resolving = false;
  motion.reset();
  roundAt = performance.now();
}

function startCountdown() {
  state = "countdown";
  document.getElementById("countdownPanel").style.display = "flex";
  const numEl = document.getElementById("countNum");
  let n = 3;
  numEl.textContent = n;
  if (!isMuted()) sound.countBeep();
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById("countdownPanel").style.display = "none";
      if (!isMuted()) sound.go();
      beginPlay();
    } else {
      numEl.textContent = n;
      if (!isMuted()) sound.countBeep();
    }
  }, 700);
}

function beginPlay() {
  state = "playing";
  const prev = HighScore.get(UNIT);
  autoDiff = new AutoDifficulty(levelFromUrl(AutoDifficulty.startLevelFromHighScore(prev)));
  count = 0;
  party.reset();
  confetti = []; sparks = [];
  playEndAt = performance.now() + 60000;
  lastFrameAt = 0;
  newRound();

  recorder = new ClipRecorder(canvas, sound, 24);
  recorder.prepare();
  comboShot = new ComboShot(canvas);
  fallbackShot = new ComboShot(canvas);
  autoRec = scheduleAutoRecording(recorder, {
    onStartVisual: () => {
      recIndicator.style.display = "flex";
      setTimeout(() => { if (!comboShot.captured) fallbackShot.capture(canvas); }, 1500);
    },
    onEndVisual: () => { recIndicator.style.display = "none"; },
    onDone: (blob) => { recordedBlob = blob; },
    fallbackMs: 8000,
  });
}

function hitDisc(d) {
  if (resolving || d.hit) return;
  d.hit = true;
  resolving = true;   // 정답이면 여기서 라운드가 끝난다 (오답이면 아래에서 되돌린다)
  bursts.push({ x: d.x, y: d.y, at: performance.now(), ok: d.ok });
  shake.trigger(d.ok ? 10 : 6, 180);
  if (d.ok) {
    count++;
    party.correct(d.x, d.y, { base: 11 * (isSpurt() ? 2 : 1), elapsedMs: performance.now() - roundAt });
    if (party.combo > 0 && party.combo === party.maxCombo) comboShot.capture(canvas);
    autoDiff.reportCorrect();
    missStreak = 0;
    noteStreak(party.combo);
    autoRec.trigger();
    if (!isMuted()) sound.hit("perfect");
    spawnSparkles(sparks, d.x, d.y, 30, ["#fff", PARTY.gold, CUTE.blue]);
    if (party.combo > 0 && party.combo % 5 === 0) {
      spawnConfetti(confetti, d.x, d.y, 44);
      if (!isMuted()) sound.fever();
    }
    setTimeout(() => { if (state === "playing") newRound(); }, NEXT_MS);
    return;
  }
  // 오답 접시를 깨뜨렸다 — 총알 한 발만 잃고 라운드는 이어진다.
  // 계산은 맞았는데 총구가 스쳐서 라운드가 끝나 버리면, 아이는 수학이 아니라
  // 조작을 원망하게 된다. 세 발 안에 정답 접시를 맞히면 된다.
  resolving = false;
  ammo--;
  party.judge(d.x, d.y, "빗나감!", CUTE.blue);
  if (!isMuted()) sound.fizzle();
  if (ammo <= 0) missAll();
}

function missAll() {
  if (resolving) return;
  resolving = true;
  missStreak++;
  party.wrong(dims.w * 0.5, dims.h * 0.55, ammo <= 0 ? "총알을 다 썼어요!" : "놓쳤어요!");
  autoDiff.reportWrong();
  if (!isMuted()) sound.wrong();
  shake.trigger(5, 150);
  setTimeout(() => { if (state === "playing") newRound(); }, NEXT_MS);
}

function endGame() {
  state = "result";
  const { medal, label } = medalFor(count, MEDALS);
  const prev = HighScore.get(UNIT);
  const best = Math.max(count, prev ? prev.count : 0);
  if (!prev || count >= prev.count) {
    HighScore.set(UNIT, { count, bestLevel: autoDiff.level, label: `${medal} ${count}${RECORD_SUFFIX}`, at: Date.now() });
  }
  renderPodium({ unit: UNIT, medal, label, coins: party.coins, maxCombo: party.maxCombo, count, suffix: RECORD_SUFFIX, best });
  document.getElementById("statCount").textContent = count + "발";
  document.getElementById("statBest").textContent = best + "발";
  document.getElementById("statCombo").textContent = "🔥" + party.maxCombo;

  const shot = comboShot.captured ? comboShot : fallbackShot;
  const previewVideo = document.getElementById("previewVideo");
  const saveVideoBtn = document.getElementById("saveVideoBtn");
  if (recordedBlob) {
    previewVideo.src = URL.createObjectURL(recordedBlob);
    previewVideo.style.display = "block";
    saveVideoBtn.style.display = "inline-block";
  }
  document.getElementById("savePhotoBtn").onclick = async () => {
    const blob = await shot.toBlob((c, w, h) => drawPhotoOverlay(c, w, h, { title: TITLE, record: count + RECORD_SUFFIX, medal }));
    downloadBlob(blob, `수학체육올림픽6_소수점클레이사격_${formatFileTimestamp()}.png`);
  };
  document.getElementById("saveVideoBtn").onclick = () => {
    if (recordedBlob) downloadBlob(recordedBlob, `수학체육올림픽6_소수점클레이사격_${formatFileTimestamp()}.${recorder.extension}`);
  };
  document.getElementById("resultPanel").style.display = "flex";
  if (!isMuted()) sound.success();
}

document.getElementById("retryBtn").addEventListener("click", () => {
  document.getElementById("resultPanel").style.display = "none";
  document.getElementById("raisePanel").style.display = "flex";
  startGate.since = 0; startGate.ready = false; holdFill.style.width = "0%";
  state = "raise";
});
document.getElementById("raisePanel").addEventListener("click", () => {
  if (state === "raise" && mode !== "motion") goReady();
});

function goReady() {
  state = "ready";
  document.getElementById("raisePanel").style.display = "none";
  document.getElementById("readyPanel").style.display = "flex";
  if (!isMuted()) sound.click();
  setTimeout(() => {
    document.getElementById("readyPanel").style.display = "none";
    startCountdown();
  }, 500);
}

// ── 조준 · 발사 ──
// 모션: 두 손목의 중점이 조준점이고, 두 손을 모아야 발사된다(손을 벌리면 안전장치).
// 터치·마우스: 커서가 조준점이고, 누르고 있는 동안 발사된다.
function readAim(dt) {
  if (mode === "motion") {
    const f = motion.last;
    if (!f) { armed = false; return; }
    const mx = (f.lw.x + f.rw.x) / 2, my = (f.lw.y + f.rw.y) / 2;
    aim.x += (mx - aim.x) * Math.min(1, dt * 18);
    aim.y += (my - aim.y) * Math.min(1, dt * 18);
    armed = Math.hypot(f.rw.x - f.lw.x, f.rw.y - f.lw.y) / f.unit <= AIM_JOIN;
  } else {
    const p = cursors[0];
    if (p) { aim.x = p.x; aim.y = p.y; }
    armed = !!(pointerInput && (pointerInput.down || pointerInput.consumeJustDown()));
  }
  recoil = Math.max(0, recoil - dt * 3.2);
}

function aimRadius() {
  return fluidPx(dims, 34, { min: 24, max: 48 }) * (0.62 + recoil * 0.8);
}

function checkHits() {
  if (resolving || !armed || ammo <= 0) return;
  const now = performance.now();
  if (now - lastShotAt < SHOT_COOL) return;
  const ar = aimRadius();
  for (const d of discs) {
    if (d.hit || d.r === 0 || d.y === 0) continue;
    if (Math.hypot(aim.x - d.x, aim.y - d.y) <= d.r + ar * 0.35) {
      lastShotAt = now;
      recoil = 1;
      shake.trigger(6, 130);
      if (!isMuted()) sound.shot();
      hitDisc(d);
      return;
    }
  }
}

function drawAim(ctx) {
  const r = aimRadius();
  ctx.save();
  ctx.globalAlpha = armed ? 0.95 : 0.45;
  ctx.strokeStyle = armed ? CUTE.red : "#fff";
  ctx.lineWidth = Math.max(3, r * 0.13);
  ctx.beginPath(); ctx.arc(aim.x, aim.y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(aim.x - r * 1.5, aim.y); ctx.lineTo(aim.x - r * 0.45, aim.y);
  ctx.moveTo(aim.x + r * 0.45, aim.y); ctx.lineTo(aim.x + r * 1.5, aim.y);
  ctx.moveTo(aim.x, aim.y - r * 1.5); ctx.lineTo(aim.x, aim.y - r * 0.45);
  ctx.moveTo(aim.x, aim.y + r * 0.45); ctx.lineTo(aim.x, aim.y + r * 1.5);
  ctx.stroke();
  ctx.restore();
  if (mode === "motion" && !armed) {
    const fs = fluidPx(dims, 15, { min: 11, max: 20 });
    drawChunkyText(ctx, "두 손을 모아야 쏴져요!", aim.x, aim.y + r * 2.1, fs, "#fff",
      { outline: CUTE.ink, outlineWidth: Math.max(3, fs * 0.24) });
  }
}

// 남은 탄약 — 아무 데나 쏘면 총알이 떨어진다
function drawAmmo(ctx) {
  const { w, h } = dims;
  const r = fluidPx(dims, 11, { min: 8, max: 15 });
  const y = h * 0.855, gap = r * 3.0;
  const x0 = w * 0.5 - (gap * (AMMO - 1)) / 2;
  for (let i = 0; i < AMMO; i++) {
    const live = i < ammo;
    drawSticker(ctx, x0 + gap * i, y, r, live ? PARTY.gold : "rgba(255,255,255,0.30)",
      { lineWidth: Math.max(2, r * 0.28) });
  }
  const fs = fluidPx(dims, 13, { min: 10, max: 18 });
  drawChunkyText(ctx, "🔫 남은 총알", w * 0.5, y + r * 2.3, fs, "#fff",
    { outline: CUTE.ink, outlineWidth: Math.max(2.5, fs * 0.24) });
}

// ── 접시 ──
function drawDiscs(ctx, now) {
  const { w, h } = dims;
  const r = Math.min(w * 0.115, h * 0.085);
  let alive = 0, appeared = 0;
  for (const d of discs) {
    d.r = r;
    const t = (now - d.at) / d.dur;
    if (t < 0) continue;
    appeared++;
    if (d.hit) continue;
    if (t >= 1) continue;
    alive++;
    const pos = d.path(t);
    d.x = pos.x; d.y = pos.y;
    d.spin += 0.05;

    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(Math.sin(d.spin) * 0.25);
    // 클레이 접시 — 셋이 완전히 같은 모양·같은 색이어야 색으로 고르지 못한다
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r * 0.72, 0, 0, Math.PI * 2);
    ctx.fillStyle = CUTE.blue; ctx.fill();
    ctx.strokeStyle = CUTE.ink; ctx.lineWidth = Math.max(3, r * 0.12); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.62, r * 0.44, 0, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = Math.max(2, r * 0.07); ctx.stroke();
    ctx.restore();

    if (d.ok) drawHelpRing(ctx, d.x, d.y, r);
    const label = fmt(d.v);
    let fs = r * 0.62;
    ctx.save(); ctx.font = `900 ${fs}px sans-serif`;
    const tw = ctx.measureText(label).width; ctx.restore();
    if (tw > r * 1.45) fs *= (r * 1.45) / tw;
    drawChunkyText(ctx, label, d.x, d.y, fs, "#fff",
      { outline: CUTE.ink, outlineWidth: Math.max(3, fs * 0.26) });
  }
  // 세 접시가 모두 나왔고 전부 사라졌으면 놓친 것
  if (!resolving && appeared === discs.length && alive === 0) missAll();

  // 명중 폭발
  bursts = bursts.filter((b) => now - b.at < 420);
  for (const b of bursts) {
    const t = (now - b.at) / 420;
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.strokeStyle = b.ok ? PARTY.gold : CUTE.red;
    ctx.lineWidth = Math.max(4, r * 0.22 * (1 - t));
    ctx.beginPath(); ctx.arc(b.x, b.y, r * (0.8 + t * 1.8), 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function drawHype(ctx, remain) {
  const { w, h } = dims;
  if (remain < 10000) {
    const fs = fluidPx(dims, 24, { min: 17, max: 33 });
    const puls = 1 + Math.sin(performance.now() / 120) * 0.08;
    ctx.save();
    ctx.translate(w * 0.5, h * 0.34); ctx.scale(puls, puls);
    drawChunkyText(ctx, "🔥 라스트 스퍼트! 코인 2배", 0, 0, fs, CUTE.red,
      { outline: "#fff", outlineWidth: Math.max(4, fs * 0.24) });
    ctx.restore();
  }
}

function loop(tsMs) {
  requestAnimationFrame(loop);
  if (mode === "motion" && video.readyState < 2) return;
  const { ctx, w, h } = dims;
  ctx.save();
  shake.apply(ctx);
  if (mode === "motion") drawMirroredVideo(ctx, video, w, h);
  else drawPartyBackdrop(ctx, dims);
  drawDrifters(ctx, drifters, dims, 1 / 60);
  drawBunting(ctx, dims);
  drawCrowd(ctx, dims, party.cheerUntil);

  let result = null;
  if (mode === "motion") {
    result = poseTracker.detect(video, tsMs);
    motion.push(tsMs, posePoints(result), w, h, video);
    if (state === "raise") {
      if (startGate.update(tsMs, isArmRaised(posePoints(result)))) goReady();
    }
  }
  cursors = getCursors(mode, result, w, h, video, pointerInput);

  if (state === "playing") stepGame();

  if (mode === "motion") {
    const f = motion.last;
    if (f) {
      const r = fluidPx(dims, 24, { min: 17, max: 33 });
      // 두 손을 잇는 선 — 모였는지 벌어졌는지가 한눈에 보여야 한다
      ctx.save();
      ctx.strokeStyle = armed ? CUTE.red : "rgba(255,255,255,0.7)";
      ctx.lineWidth = Math.max(3, r * 0.22);
      ctx.beginPath(); ctx.moveTo(f.lw.x, f.lw.y); ctx.lineTo(f.rw.x, f.rw.y); ctx.stroke();
      ctx.restore();
      for (const k of ["lw", "rw"]) {
        drawSticker(ctx, f[k].x, f[k].y, r, armed ? CUTE.red : PARTY.gold, { lineWidth: Math.max(3, r * 0.15) });
        drawChunkyText(ctx, "✊", f[k].x, f[k].y, r * 1.0, "#fff", { outline: CUTE.ink, outlineWidth: 2 });
      }
    } else if (state === "playing") {
      drawChunkyText(ctx, "카메라에 두 손이 보이게 서 주세요!", w * 0.5, h * 0.95,
        fluidPx(dims, 20, { min: 15, max: 27 }), "#fff",
        { outline: CUTE.ink, outlineWidth: fluidPx(dims, 6, { min: 4, max: 8 }) });
    }
  } else {
    for (const c of cursors) drawGloveCursor(ctx, c.x, c.y, fluidPx(dims, 40, { min: 30, max: 56 }), { active: !resolving });
  }
  ctx.restore();
}

function stepGame() {
  const { ctx, w, h } = dims;
  const dt = lastFrameAt ? Math.min(0.06, (performance.now() - lastFrameAt) / 1000) : 1 / 60;
  lastFrameAt = performance.now();
  const remain = Math.max(0, playEndAt - performance.now());
  if (remain <= 0) { endGame(); return; }
  const now = performance.now();

  drawDiscs(ctx, now);
  readAim(dt);
  checkHits();
  if (!resolving) drawAim(ctx);
  drawAmmo(ctx);

  const br = fluidPx(dims, 20, { min: 15, max: 27 });
  drawMascot(ctx, w * 0.94, h * 0.94, br, CHAR, party.currentMood(remain));

  const hudBottom = party.drawHud(ctx, dims, { remainMs: remain, count, suffix: "발" });
  drawCuteBanner(ctx, dims, [
    { text: round.q, size: 32, chunky: true, color: PARTY.gold },
    { text: round.formula, size: 14, color: CUTE.ink },
  ], fluidPx, { top: hudBottom });
  drawHype(ctx, remain);

  drawChunkyText(ctx,
    mode === "motion" ? "두 손을 모아 조준! 정답 접시를 쏘세요" : "누른 채로 조준! 정답 접시를 쏘세요",
    w * 0.5, h * 0.965, fluidPx(dims, 14, { min: 11, max: 19 }), "#fff",
    { outline: CUTE.ink, outlineWidth: fluidPx(dims, 5, { min: 3.5, max: 7 }) });

  party.update(dt);
  confetti = updateConfetti(confetti, dt); drawConfetti(ctx, confetti);
  sparks = updateSparkles(sparks, dt); drawSparkles(ctx, sparks);
  drawStreak(ctx);
  party.drawFx(ctx, dims);
  party.drawFeverFrame(ctx, dims);
  drawVignette(ctx, w, h, 0.16);
  drawLevelStars(ctx, dims, autoDiff.level, fluidPx);
}

init();
</script>
